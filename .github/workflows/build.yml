name: Build APK & Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Installer Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: CatatToko-Windows
          path: dist/*.exe
          if-no-files-found: error

  lisensi:
    name: Pembuat Lisensi (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lisensi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: PembuatLisensi-Windows
          path: lisensi/dist/*.exe
          if-no-files-found: error

  android:
    name: APK Android
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Siapkan proyek Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor "#0E7A5C" --splashBackgroundColor "#F2F6F4" --splashBackgroundColorDark "#0D1412"
          npx cap sync android
      - name: Siapkan kunci tanda tangan
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/catattoko.jks
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$PWD/app/catattoko.jks" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../CatatToko.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../CatatToko.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CatatToko-Android
          path: CatatToko.apk
          if-no-files-found: error

  release:
    name: Rilis (saat push tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android, lisensi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CatatToko-Windows/*.exe
            out/CatatToko-Android/CatatToko.apk
