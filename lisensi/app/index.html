<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pembuat Lisensi Catat Toko</title>
<script src="nacl-fast.min.js"></script>
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:400;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:500;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:600;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:700;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format("woff2")}
/* Layout: panel kerja penjual — bilah samping gelap (menu), area kerja terang dengan formulir di atas dan daftar lisensi di bawah */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#EAF0EE; --ink:#13231F; --muted:#5A6D67; --line:#D9E3DF;
  --side:#13231F; --side-ink:#DCE8E3; --side-muted:#8FA59D;
  --accent:#0E7A5C; --accent-ink:#FFFFFF; --accent-soft:#DCF0E8; --amber:#A85A08; --amber-soft:#FCEBD6; --red:#B42318; --red-soft:#FCE6E3;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D1412; --surface:#15201C; --sunk:#1B2824; --ink:#E5EFEA; --muted:#93A7A0; --line:#25342F;
  --side:#08100E; --side-ink:#DCE8E3; --side-muted:#7F958D;
  --accent:#3DC79A; --accent-ink:#04201A; --accent-soft:#12392D; --amber:#F0A64E; --amber-soft:#3A2913; --red:#F27468; --red-soft:#3D1A17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);display:grid;grid-template-columns:230px 1fr}
aside{background:var(--side);color:var(--side-ink);padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;gap:10px;align-items:center}
.brand img{width:38px;height:38px;border-radius:10px}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.brand small{color:var(--side-muted);font-size:12px}
aside nav{display:flex;flex-direction:column;gap:4px}
aside nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--side-muted)}
aside nav button[aria-current="page"]{background:rgba(255,255,255,.08);color:var(--side-ink)}
aside nav button:focus-visible{outline:2px solid var(--accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-muted)}
main{overflow:auto;padding:28px 32px;display:flex;flex-direction:column;gap:22px;min-width:0}
h1{font-size:22px;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:16px;margin:0;font-weight:700}
p.lead{margin:4px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,textarea{width:100%;font:500 15px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input.mono,textarea.mono{font-family:var(--mono);letter-spacing:.04em}
.btn{border:0;border-radius:10px;padding:11px 16px;font:700 14px var(--font);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.code{font-family:var(--mono);font-size:14px;line-height:1.7;background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:14px 16px;word-break:break-all;user-select:all}
.note{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600}
.err{color:var(--red);font-size:13px;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--mono);white-space:nowrap}
td.act{white-space:nowrap;text-align:right}
.num{font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:150px}
.stat span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat b{display:block;font-size:22px;font-weight:800}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
ol.steps b{color:var(--ink)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px}
@media (max-width:820px){body{grid-template-columns:1fr}aside{flex-direction:row;align-items:center;padding:12px 16px;flex-wrap:wrap}aside nav{flex-direction:row}.side-foot{display:none}main{padding:20px 16px}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="../icon.png" alt=""><div><b>Pembuat Lisensi</b><small>Catat Toko</small></div></div>
  <nav id="nav">
    <button type="button" data-v="buat" aria-current="page">Buat kode</button>
    <button type="button" data-v="daftar">Daftar lisensi</button>
    <button type="button" data-v="kunci">Kunci</button>
  </nav>
  <div class="side-foot">Hanya untuk penjual. Jangan bagikan aplikasi ini ke pembeli.</div>
</aside>
<main id="main"></main>
<input type="file" id="fRestore" accept=".json,application/json" hidden>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32enc(bytes){let bits=0,val=0,out="";for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(str){const s=String(str||"").toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");let bits=0,val=0;const out=[];
  for(const ch of s){const i=B32.indexOf(ch);if(i<0)return null;val=((val<<5)|i)&0xffff;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
const group=(s,n)=>(s.match(new RegExp(".{1,"+n+"}","g"))||[]).join("-");
const msg=dev=>new Uint8Array(new TextEncoder().encode("CATATTOKO|"+dev));
const DEV_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function normDev(v){const s=String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"");return s.length===12&&[...s].every(c=>DEV_CH.includes(c))?group(s,4):null}
const waNum=h=>{let d=String(h||"").replace(/\D/g,"");if(d.startsWith("0"))d="62"+d.slice(1);return d};
const fmtD=t=>new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});

const store={
  get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(_){return def}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("Gagal menyimpan di komputer ini");return false}}
};
let KEY=store.get("lisensi.kunci",null);   // {pub, sec, dibuat}
let LIST=store.get("lisensi.daftar",[]);   // [{id, nama, wa, dev, kode, tgl, catatan}]
let VIEW="buat", Q="", LAST=null;

function makeCode(dev){const sec=b32dec(KEY.sec);const sig=nacl.sign.detached(msg(dev),sec);return group(b32enc(sig),5)}
function checkCode(code,dev){try{return nacl.sign.detached.verify(msg(dev),b32dec(code).slice(0,64),b32dec(KEY.pub))}catch(_){return false}}
function waText(r){return "Halo "+(r.nama||"")+", berikut kode aktivasi Catat Toko untuk perangkat "+r.dev+":\n\n"+r.kode+"\n\nCara pakai: buka Catat Toko, salin seluruh kode di atas, tempel di kolom Kode aktivasi, lalu tekan Aktifkan. Terima kasih!"}

function toast(m){$("#toastRoot").innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toastRoot").innerHTML="",2400)}
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast("Disalin")}catch(_){toast("Gagal menyalin, pilih teksnya lalu tekan Ctrl+C")}}
function saveFile(name,text,mime){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===VIEW?"page":"false"));
  const m=$("#main");
  if(!KEY){m.innerHTML=vSetup();return}
  m.innerHTML=({buat:vBuat,daftar:vDaftar,kunci:vKunci})[VIEW]();
  if(VIEW==="buat")$("#fDev").focus();
}
function vSetup(){
  return '<div><h1>Siapkan kunci lisensi</h1><p class="lead">Kunci ini dipakai untuk membuat kode aktivasi. Cukup dibuat sekali. Kunci rahasianya hanya tersimpan di komputer ini.</p></div>'+
  '<div class="card"><ol class="steps"><li>Tekan <b>Buat kunci baru</b>.</li><li>Salin <b>kunci publik</b> yang muncul, lalu tempel ke <b>LICENSE_PUBLIC_KEY</b> di file <b>www/config.js</b> proyek Catat Toko, kemudian build ulang aplikasinya.</li><li>Langsung <b>cadangkan kunci</b> ke flashdisk atau Google Drive. Jika kunci hilang, Anda tidak bisa membuat kode untuk aplikasi yang sudah terjual.</li></ol>'+
  '<div class="row"><button class="btn" type="button" data-a="gen">Buat kunci baru</button><button class="btn ghost" type="button" data-a="restore">Pulihkan dari cadangan</button></div></div>';
}
function vBuat(){
  let h='<div><h1>Buat kode aktivasi</h1><p class="lead">Masukkan ID perangkat yang dikirim pembeli. ID ini tampil di layar aktivasi atau di Pengaturan aplikasi Catat Toko.</p></div>'+
  '<form class="card" id="fBuat"><div class="grid3"><label class="f">ID perangkat<input id="fDev" class="mono" placeholder="XXXX-XXXX-XXXX" autocomplete="off" required></label><label class="f">Nama pembeli<input id="fNama" placeholder="mis. Toko Bu Sari"></label><label class="f">No. WhatsApp<input id="fWa" inputmode="tel" placeholder="08xxxxxxxxxx"></label></div>'+
  '<label class="f">Catatan (opsional)<input id="fCat" placeholder="mis. Lunas transfer BCA 12 Nov"></label><div id="fErr" class="err"></div><div class="row"><button class="btn" type="submit">Buat kode</button></div></form>';
  if(LAST){h+='<div class="card"><div class="row" style="justify-content:space-between"><h2>Kode untuk '+esc(LAST.nama||"pembeli")+'</h2><span class="num" style="color:var(--muted);font-size:13px">ID '+esc(LAST.dev)+'</span></div>'+
    '<div class="code" id="codeBox">'+esc(LAST.kode)+'</div><div class="row"><button class="btn" type="button" data-a="copyLast">Salin kode</button><button class="btn ghost" type="button" data-a="copyMsg">Salin pesan lengkap</button>'+(waNum(LAST.wa)?'<button class="btn ghost" type="button" data-a="waLast">Kirim via WhatsApp</button>':'')+'</div>'+
    '<small style="color:var(--muted)">Sudah tersimpan di Daftar lisensi.</small></div>'}
  return h;
}
function vDaftar(){
  const q=Q.trim().toLowerCase();
  const rows=LIST.filter(r=>!q||[r.nama,r.wa,r.dev,r.catatan].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.tgl-a.tgl);
  const bulan=new Date();bulan.setDate(1);bulan.setHours(0,0,0,0);
  return '<div class="row" style="justify-content:space-between"><div><h1>Daftar lisensi</h1><p class="lead">Semua kode yang pernah dibuat di komputer ini.</p></div><button class="btn ghost" type="button" data-a="csv"'+(LIST.length?'':' disabled')+'>Ekspor CSV</button></div>'+
  '<div class="stats"><div class="stat"><span>Total lisensi</span><b class="num">'+LIST.length+'</b></div><div class="stat"><span>Bulan ini</span><b class="num">'+LIST.filter(r=>r.tgl>=bulan.getTime()).length+'</b></div></div>'+
  '<input id="fQ" type="search" placeholder="Cari nama, WA, ID perangkat…" value="'+esc(Q)+'">'+
  (rows.length?'<div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Pembeli</th><th>WhatsApp</th><th>ID perangkat</th><th>Catatan</th><th></th></tr></thead><tbody>'+rows.map(r=>
    '<tr><td class="num">'+fmtD(r.tgl)+'</td><td>'+esc(r.nama||"—")+'</td><td class="num">'+esc(r.wa||"—")+'</td><td class="mono">'+esc(r.dev)+'</td><td>'+esc(r.catatan||"")+'</td><td class="act"><button class="btn ghost sm" type="button" data-a="copyRow" data-id="'+r.id+'">Salin kode</button> '+(waNum(r.wa)?'<button class="btn ghost sm" type="button" data-a="waRow" data-id="'+r.id+'">WA</button> ':'')+'<button class="btn ghost sm danger" type="button" data-a="delRow" data-id="'+r.id+'">Hapus</button></td></tr>').join("")+'</tbody></table></div>'
  :'<div class="card empty">'+(LIST.length?'Tidak ada yang cocok dengan pencarian.':'Belum ada lisensi. Buat kode pertama di menu Buat kode.')+'</div>');
}
function vKunci(){
  return '<div><h1>Kunci lisensi</h1><p class="lead">Kunci publik dipasang di aplikasi Catat Toko. Kunci rahasia hanya ada di komputer ini dan di file cadangan Anda.</p></div>'+
  '<div class="card"><h2>Kunci publik</h2><div class="code" id="pubBox">'+esc(KEY.pub)+'</div><div class="row"><button class="btn" type="button" data-a="copyPub">Salin kunci publik</button></div>'+
  '<small style="color:var(--muted)">Tempel ke <b>LICENSE_PUBLIC_KEY</b> di <b>www/config.js</b> proyek Catat Toko, lalu build ulang. Kunci publik aman dibagikan.</small></div>'+
  '<div class="card"><h2>Cadangan</h2><div class="note">File cadangan berisi kunci rahasia. Simpan di tempat aman (flashdisk, Google Drive pribadi) dan jangan dikirim ke siapa pun.</div>'+
  '<div class="row"><button class="btn" type="button" data-a="backup">Cadangkan kunci & daftar</button><button class="btn ghost" type="button" data-a="restore">Pulihkan dari cadangan</button></div>'+
  '<small style="color:var(--muted)">Kunci dibuat '+fmtD(KEY.dibuat)+'.</small></div>';
}

document.addEventListener("click",e=>{
  const n=e.target.closest("#nav button");if(n){VIEW=n.dataset.v;render();return}
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  const row=id?LIST.find(r=>r.id===id):null;
  if(a==="gen"){const kp=nacl.sign.keyPair();KEY={pub:b32enc(kp.publicKey),sec:b32enc(kp.secretKey),dibuat:Date.now()};store.set("lisensi.kunci",KEY);VIEW="kunci";render();toast("Kunci dibuat. Salin kunci publik dan buat cadangan.");return}
  if(a==="restore"){$("#fRestore").click();return}
  if(a==="copyLast")return copy(LAST.kode);
  if(a==="copyMsg")return copy(waText(LAST));
  if(a==="waLast")return window.open("https://wa.me/"+waNum(LAST.wa)+"?text="+encodeURIComponent(waText(LAST)));
  if(a==="copyRow")return copy(row.kode);
  if(a==="waRow")return window.open("https://wa.me/"+waNum(row.wa)+"?text="+encodeURIComponent(waText(row)));
  if(a==="delRow"){if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Yakin hapus?";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Hapus"}},3000);return}
    LIST=LIST.filter(r=>r.id!==id);store.set("lisensi.daftar",LIST);render();toast("Dihapus dari daftar (kode tetap berlaku di perangkat pembeli)");return}
  if(a==="copyPub")return copy(KEY.pub);
  if(a==="csv"){const rows=[["Tanggal","Nama","WhatsApp","ID perangkat","Kode aktivasi","Catatan"]].concat(LIST.slice().sort((x,y)=>x.tgl-y.tgl).map(r=>[new Date(r.tgl).toLocaleString("id-ID"),r.nama,r.wa,r.dev,r.kode,r.catatan]));
    saveFile("daftar-lisensi-"+new Date().toISOString().slice(0,10)+".csv","﻿"+rows.map(r=>r.map(c=>'"'+String(c||"").replace(/"/g,'""')+'"').join(";")).join("\r\n"),"text/csv");return}
  if(a==="backup"){saveFile("cadangan-kunci-lisensi-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({aplikasi:"pembuat-lisensi-catat-toko",versi:1,kunci:KEY,daftar:LIST},null,2),"application/json");toast("Cadangan disimpan");return}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="fBuat")return;e.preventDefault();
  const dev=normDev($("#fDev").value);
  if(!dev){$("#fErr").textContent="ID perangkat harus 12 huruf/angka, contoh 7KQ2-M8XA-PZ4N. Periksa lagi ID dari pembeli.";return}
  const kode=makeCode(dev);
  if(!checkCode(kode,dev)){$("#fErr").textContent="Kunci rusak. Pulihkan kunci dari file cadangan.";return}
  const lama=LIST.find(r=>r.dev===dev);
  const r={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),nama:$("#fNama").value.trim(),wa:$("#fWa").value.trim(),dev,kode,tgl:Date.now(),catatan:$("#fCat").value.trim()};
  if(lama&&!r.nama)r.nama=lama.nama;if(lama&&!r.wa)r.wa=lama.wa;
  LIST.push(r);store.set("lisensi.daftar",LIST);LAST=r;render();
  if(lama)toast("ID ini pernah dibuatkan kode pada "+fmtD(lama.tgl)+". Kodenya sama.");
});
document.addEventListener("input",e=>{if(e.target.id==="fQ"){Q=e.target.value;const p=e.target.selectionStart;render();const i=$("#fQ");i.focus();try{i.setSelectionRange(p,p)}catch(_){}}});
$("#fRestore").addEventListener("change",ev=>{
  const f=ev.target.files[0];ev.target.value="";if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(d.aplikasi!=="pembuat-lisensi-catat-toko"||!d.kunci||!d.kunci.pub||!d.kunci.sec)throw 0;
    const kp=nacl.sign.keyPair.fromSecretKey(b32dec(d.kunci.sec));if(b32enc(kp.publicKey)!==d.kunci.pub)throw 0;
    if(KEY&&KEY.pub!==d.kunci.pub)toast("Kunci diganti dengan kunci dari cadangan");
    KEY=d.kunci;const ids=new Set(LIST.map(r=>r.id));LIST=LIST.concat((d.daftar||[]).filter(r=>!ids.has(r.id)));
    store.set("lisensi.kunci",KEY);store.set("lisensi.daftar",LIST);VIEW="kunci";render();toast("Kunci dan daftar lisensi dipulihkan")}
    catch(_){toast("File ini bukan cadangan Pembuat Lisensi yang valid")}};
  rd.readAsText(f);
});
render();
})();
</script>
</body>
</html>
