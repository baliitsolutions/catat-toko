<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7A5C">
<title>Catat Toko</title>
<script src="config.js"></script>
<script src="vendor/nacl-fast.min.js"></script>
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:400;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:500;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:600;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:700;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format("woff2")}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: aplikasi satu kolom (maks 760px) dengan header sticky dan navigasi bawah tetap, seperti buku kas di saku */
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --sunk:#E8EFEC; --ink:#13231F; --muted:#5A6D67; --line:#D9E3DF;
  --accent:#0E7A5C; --accent-ink:#FFFFFF; --accent-soft:#DCF0E8;
  --amber:#A85A08; --amber-soft:#FCEBD6; --red:#B42318; --red-soft:#FCE6E3;
  --shadow:0 1px 2px rgba(19,35,31,.06),0 6px 20px rgba(19,35,31,.06);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#15201C; --sunk:#1B2824; --ink:#E5EFEA; --muted:#93A7A0; --line:#25342F;
  --accent:#3DC79A; --accent-ink:#04201A; --accent-soft:#12392D;
  --amber:#F0A64E; --amber-soft:#3A2913; --red:#F27468; --red-soft:#3D1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#15201C; --sunk:#1B2824; --ink:#E5EFEA; --muted:#93A7A0; --line:#25342F;
  --accent:#3DC79A; --accent-ink:#04201A; --accent-soft:#12392D;
  --amber:#F0A64E; --amber-soft:#3A2913; --red:#F27468; --red-soft:#3D1A17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
.brand h1{font-size:17px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:600 13px var(--font);cursor:pointer}
h2{font-size:18px;margin:0;font-weight:800;text-wrap:balance}
h3{font-size:14px;margin:0;font-weight:700}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.01em}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hero-row div{background:rgba(255,255,255,.12);border-radius:10px;padding:10px;min-width:0}
.hero-row b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-row span{font-size:11px;opacity:.85}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px;font:600 12px var(--font);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.quick svg{width:22px;height:22px;stroke:var(--accent)}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main small{color:var(--muted);font-size:12px}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--sunk);color:var(--muted)}
.pos{color:var(--accent)} .neg{color:var(--red)} .warn{color:var(--amber)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.g{background:var(--accent-soft);color:var(--accent)} .pill.a{background:var(--amber-soft);color:var(--amber)} .pill.r{background:var(--red-soft);color:var(--red)} .pill.n{background:var(--sunk);color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 14px var(--font);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-size:18px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
input,select,textarea{width:100%;font:500 15px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
form.stack{display:flex;flex-direction:column;gap:12px}
.search{position:relative}
/* Kasir */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;font-family:var(--font);color:var(--ink);display:flex;flex-direction:column;gap:4px;position:relative;min-width:0}
.prod b{font-size:14px;font-weight:600;line-height:1.3}
.prod .price{font-weight:800;color:var(--accent)}
.prod small{color:var(--muted);font-size:12px}
.prod .qty{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px;font-weight:800;padding:0 6px}
.prod[data-out="1"]{opacity:.5}
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.cartbar .in{max-width:760px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow);cursor:pointer;border:0;width:100%;font-family:var(--font)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--font);cursor:pointer}
/* Nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.bottom button{background:none;border:0;padding:8px 2px 10px;font:600 11px var(--font);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.bottom svg{width:22px;height:22px;stroke:currentColor}
nav.bottom button[aria-current="page"]{color:var(--accent)}
svg.i{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:var(--sunk);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--ink);font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:30;max-width:90vw}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:36px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.bar i.today{background:var(--ink)}
.bar span{font-size:11px;color:var(--muted)}
.bar em{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.nota{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:13px}
.nota .ln{display:flex;justify-content:space-between;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.toggle button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:600 13px var(--font);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.split{display:flex;gap:8px}
.split>*{flex:1}
@media (max-width:420px){.hero-row{grid-template-columns:1fr 1fr}.hero-row div:last-child{grid-column:span 2}.quick button{font-size:11px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" id="logo">CT</div>
      <div style="min-width:0"><h1 id="shopName">Catat Toko</h1><small id="todayLbl"></small></div>
    </div>
    <button class="iconbtn" id="btnSettings" type="button">Pengaturan</button>
  </header>
  <div id="banner"></div>
  <main id="view" class="wrap" style="gap:18px"></main>
</div>
<div id="cartbar"></div>
<nav class="bottom" aria-label="Menu utama"><div class="in" id="nav"></div></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
"use strict";
/* ---------- util ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>"Rp"+Math.round(Number(n)||0).toLocaleString("id-ID");
const num=v=>{const n=Number(String(v).replace(/[^\d-]/g,""));return isFinite(n)?n:0};
const DAY=86400000;
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const fmtD=t=>new Date(t).toLocaleDateString("id-ID",{day:"numeric",month:"short"});
const fmtDT=t=>new Date(t).toLocaleString("id-ID",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const toInputDate=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const initials=s=>String(s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const waNum=h=>{let d=String(h||"").replace(/\D/g,"");if(d.startsWith("0"))d="62"+d.slice(1);return d};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 kasir:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4M7 9h4"/>',
 utang:'<path d="M4 6h16v12H4z"/><path d="M8 10h8M8 14h5"/>',
 kas:'<path d="M12 3v18M17 7.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2 2.6 5 3.2 5 1.4 5 3.3-2.2 3-5 3-5-1.1-5-3"/>',
 stok:'<path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7M12 11v10"/>',
 lap:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>'
};
const ico=(k,cls)=>'<svg class="i '+(cls||"")+'" viewBox="0 0 24 24" aria-hidden="true">'+I[k]+'</svg>';

/* ---------- state ---------- */
const S={mode:"loading",toko:{nama:"Toko Saya",pemilik:"",hp:"",minStok:5},produk:[],jual:[],kas:[],pelanggan:[],utang:[],
  cart:{},tab:"beranda",periode:"hari",q:"",kasFilter:"semua",loaded:{},stale:false};
const COLS=["produk","jual","kas","pelanggan","utang"];
const CFG=Object.assign({APP_NAME:"Catat Toko",TRIAL_DAYS:30,LICENSE_ENABLED:true,LICENSE_PUBLIC_KEY:"",KONTAK_WA:"",KONTAK_NAMA:""},window.CATAT_CONFIG||{});
const KEY_DATA="catattoko.data.v1";

/* ---------- data layer (disimpan di perangkat) ---------- */
function persist(){
  const out={versi:1,toko:S.toko};for(const c of COLS)out[c]=S[c];
  try{localStorage.setItem(KEY_DATA,JSON.stringify(out));return true}
  catch(e){console.error(e);toast("Penyimpanan perangkat penuh. Buat cadangan lalu hapus data lama.");return false}
}
function loadLocal(){
  try{const raw=localStorage.getItem(KEY_DATA);if(!raw)return false;const d=JSON.parse(raw);
    if(d.toko)S.toko=Object.assign({nama:"Toko Saya",minStok:5},d.toko);for(const c of COLS)S[c]=Array.isArray(d[c])?d[c]:[];return true}
  catch(e){console.error(e);return false}
}
async function addDoc(col,data){const id=uid();S[col].push(Object.assign({id},data));persist();render();return id}
async function updDoc(col,id,data){const o=S[col].find(x=>x.id===id);if(o)Object.assign(o,data);persist();render()}
async function delDoc(col,id){S[col]=S[col].filter(x=>x.id!==id);persist();render()}
async function saveToko(data){Object.assign(S.toko,data);persist();render()}
function errMsg(){return "Gagal menyimpan. Coba lagi."}

/* ---------- simpan file (Windows/Android/browser) ---------- */
function isNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}
async function saveFile(filename,text,mime){
  if(isNative()){
    const P=window.Capacitor.Plugins;
    const r=await P.Filesystem.writeFile({path:filename,data:text,directory:"CACHE",encoding:"utf8"});
    try{await P.Share.share({title:filename,url:r.uri,dialogTitle:"Simpan atau kirim "+filename})}catch(_){}
    return;
  }
  const blob=new Blob([text],{type:mime||"text/plain"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function openExternal(url){
  if(isNative()&&window.Capacitor.Plugins.Browser){window.Capacitor.Plugins.Browser.open({url});return}
  window.open(url,"_blank","noopener");
}

/* ---------- lisensi ---------- */
/* Kode lisensi = tanda tangan Ed25519 atas "CATATTOKO|<ID perangkat>", ditulis dalam base32 Crockford.
   Aplikasi ini hanya menyimpan KUNCI PUBLIK, jadi tidak bisa membuat kode sendiri. */
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32enc(bytes){let bits=0,val=0,out="";for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(str){const s=String(str||"").toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");let bits=0,val=0;const out=[];
  for(const ch of s){const i=B32.indexOf(ch);if(i<0)return null;val=((val<<5)|i)&0xffff;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
function licMsg(dev){return new Uint8Array(new TextEncoder().encode("CATATTOKO|"+dev))}
function verifyKey(code,dev){
  try{if(!window.nacl||!CFG.LICENSE_PUBLIC_KEY)return false;const pub=b32dec(CFG.LICENSE_PUBLIC_KEY);const sig=b32dec(code);
    if(!pub||pub.length!==32||!sig||sig.length<64)return false;return window.nacl.sign.detached.verify(licMsg(dev),sig.slice(0,64),pub)}catch(e){return false}
}
function deviceId(){
  let d=null;try{d=localStorage.getItem("catattoko.device")}catch(_){}
  if(!d){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let r="";const a=new Uint32Array(12);crypto.getRandomValues(a);for(let i=0;i<12;i++){r+=ch[a[i]%ch.length];if(i===3||i===7)r+="-"}d=r;try{localStorage.setItem("catattoko.device",d)}catch(_){}}
  return d;
}
function licState(){
  if(!CFG.LICENSE_ENABLED)return{status:"aktif",sisa:Infinity};
  const dev=deviceId();let key="",first=0;
  try{key=localStorage.getItem("catattoko.key")||"";first=Number(localStorage.getItem("catattoko.first"))||0}catch(_){}
  if(!first){first=Date.now();try{localStorage.setItem("catattoko.first",String(first))}catch(_){}}
  if(key&&verifyKey(key,dev))return{status:"aktif",sisa:Infinity,dev};
  const sisa=Math.ceil((first+CFG.TRIAL_DAYS*DAY-Date.now())/DAY);
  return{status:sisa>0?"trial":"habis",sisa:Math.max(0,sisa),dev};
}
function activate(input){
  const code=String(input||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(!verifyKey(code,deviceId()))return false;
  try{localStorage.setItem("catattoko.key",code)}catch(_){}return true;
}
function waLisensi(){const n=waNum(CFG.KONTAK_WA);return n?"https://wa.me/"+n+"?text="+encodeURIComponent("Halo, saya ingin aktivasi "+CFG.APP_NAME+". ID perangkat saya: "+deviceId()):""}
function vLock(){
  const L=licState();const wa=waLisensi();

/* ---------- derived ---------- */
function range(p){const now=Date.now(),t=sod(now);
  if(p==="hari")return[t,now+DAY];if(p==="minggu")return[t-6*DAY,now+DAY];
  if(p==="bulan"){const d=new Date(t);d.setDate(1);return[d.getTime(),now+DAY]}
  return[0,now+DAY]}
const inR=(t,[a,b])=>t>=a&&t<b;
function saldoPel(pid){let s=0;for(const u of S.utang)if(u.pelangganId===pid)s+=u.jenis==="berikan"?u.jumlah:-u.jumlah;return s}
function totalPiutang(){return S.pelanggan.reduce((a,p)=>{const s=saldoPel(p.id);return a+(s>0?s:0)},0)}
function kasEntries(){
  const out=[];
  for(const j of S.jual)if(j.bayar!=="utang")out.push({t:j.tgl,jenis:"masuk",jumlah:j.total,ket:"Penjualan"+(j.metode&&j.metode!=="tunai"?" ("+j.metode+")":""),kat:"Penjualan",src:"jual",id:j.id});
  for(const k of S.kas)out.push({t:k.tgl,jenis:k.jenis,jumlah:k.jumlah,ket:k.catatan||k.kategori,kat:k.kategori,src:"kas",id:k.id});
  for(const u of S.utang)if(u.jenis==="terima"){const p=S.pelanggan.find(x=>x.id===u.pelangganId);out.push({t:u.tgl,jenis:"masuk",jumlah:u.jumlah,ket:"Bayar utang · "+(p?p.nama:"Pelanggan"),kat:"Pelunasan utang",src:"utang",id:u.id})}
  return out.sort((a,b)=>b.t-a.t);
}
function saldoKas(){return kasEntries().reduce((a,e)=>a+(e.jenis==="masuk"?e.jumlah:-e.jumlah),0)}
function laporan(p){
  const r=range(p);let omzet=0,modal=0,trx=0,masukLain=0,keluar=0,lunas=0;const per={};const katK={};
  for(const j of S.jual)if(inR(j.tgl,r)){omzet+=j.total;modal+=j.modal||0;trx++;for(const it of j.items||[]){per[it.nama]=(per[it.nama]||0)+it.qty}}
  for(const k of S.kas)if(inR(k.tgl,r)){if(k.jenis==="masuk")masukLain+=k.jumlah;else{keluar+=k.jumlah;katK[k.kategori]=(katK[k.kategori]||0)+k.jumlah}}
  for(const u of S.utang)if(u.jenis==="terima"&&inR(u.tgl,r))lunas+=u.jumlah;
  const labaKotor=omzet-modal;
  return{omzet,modal,trx,masukLain,keluar,lunas,labaKotor,labaBersih:labaKotor+masukLain-keluar,
    top:Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,5),katK:Object.entries(katK).sort((a,b)=>b[1]-a[1])};
}
const lowStok=()=>S.produk.filter(p=>(p.stok||0)<=(p.minStok!=null?p.minStok:S.toko.minStok||5)).sort((a,b)=>a.stok-b.stok);
const cartItems=()=>Object.entries(S.cart).map(([id,q])=>{const p=S.produk.find(x=>x.id===id);return p?{p,q}:null}).filter(Boolean);
const cartTotal=()=>cartItems().reduce((a,{p,q})=>a+p.harga*q,0);
const dueInfo=pid=>{const list=S.utang.filter(u=>u.pelangganId===pid&&u.jenis==="berikan"&&u.jatuhTempo);if(!list.length)return null;return Math.min(...list.map(u=>u.jatuhTempo))};

const TABS=[["beranda","Beranda","home"],["kasir","Kasir","kasir"],["utang","Utang","utang"],["kas","Kas","kas"],["stok","Stok","stok"],["laporan","Laporan","lap"]];

function isEmptyStore(){return COLS.every(c=>!S[c].length)}

  }

  if(due.length){h+='<section class="sec"><div class="sec-head"><h3>Utang jatuh tempo</h3><span class="pill a">'+due.length+' pelanggan</span></div><div class="list">'+due.map(x=>'<div class="row tap" data-act="pel" data-id="'+x.p.id+'"><div class="av">'+esc(initials(x.p.nama))+'</div><div class="main"><b>'+esc(x.p.nama)+'</b><small>'+(x.d<sod(now)?'Lewat jatuh tempo '+fmtD(x.d):'Jatuh tempo '+fmtD(x.d))+'</small></div><div class="amt warn num">'+rp(x.s)+'</div></div>').join("")+'</div></section>'}
  const low=lowStok();
  if(low.length){h+='<section class="sec"><div class="sec-head"><h3>Stok hampir habis</h3><button class="chip" type="button" data-tab="stok">Lihat stok</button></div><div class="list">'+low.slice(0,4).map(p=>'<div class="row tap" data-act="editProduk" data-id="'+p.id+'"><div class="main"><b>'+esc(p.nama)+'</b><small>Batas minimum '+(p.minStok!=null?p.minStok:S.toko.minStok||5)+' '+esc(p.satuan||"pcs")+'</small></div><span class="pill '+(p.stok<=0?"r":"a")+'">'+(p.stok<=0?"Habis":"Sisa "+p.stok)+'</span></div>').join("")+'</div></section>'}
  const last=kasEntries().slice(0,6);
  h+='<section class="sec"><div class="sec-head"><h3>Transaksi terakhir</h3><button class="chip" type="button" data-tab="kas">Semua</button></div>'+(last.length?'<div class="list">'+last.map(rowKas).join("")+'</div>':'<div class="card empty">Belum ada transaksi. Catat penjualan pertama lewat menu Kasir.</div>')+'</section>';

function rowKas(e){
  return '<div class="row'+(e.src==="kas"?' tap" data-act="kasDetail" data-id="'+e.id+'"':'"')+'><div class="av" style="background:'+(e.jenis==="masuk"?"var(--accent-soft);color:var(--accent)":"var(--red-soft);color:var(--red)")+'">'+(e.jenis==="masuk"?"+":"−")+'</div><div class="main"><b>'+esc(e.ket)+'</b><small>'+fmtDT(e.t)+' · '+esc(e.kat)+'</small></div><div class="amt num '+(e.jenis==="masuk"?"pos":"neg")+'">'+(e.jenis==="masuk"?"+":"−")+rp(e.jumlah)+'</div></div>';
}
function vKasir(){
  const q=S.q.trim().toLowerCase();
  const list=S.produk.filter(p=>!q||p.nama.toLowerCase().includes(q)).sort((a,b)=>a.nama.localeCompare(b.nama));
  let h='<section class="sec"><div class="sec-head"><h2>Kasir</h2><button class="btn sm ghost" type="button" data-act="addProduk">+ Barang</button></div>'+
    '<input id="qProduk" type="search" placeholder="Cari barang…" value="'+esc(S.q)+'" autocomplete="off"></section>';
  if(!S.produk.length)return h+'<div class="card empty">Belum ada barang. Tambahkan barang dagangan dulu supaya bisa dijual.</div>';
  h+='<section class="prod-grid">'+list.map(p=>{const c=S.cart[p.id]||0;return '<button type="button" class="prod" data-act="addCart" data-id="'+p.id+'" data-out="'+(p.stok<=0?1:0)+'">'+(c?'<span class="qty">'+c+'</span>':'')+'<b>'+esc(p.nama)+'</b><span class="price num">'+rp(p.harga)+'</span><small>Stok '+p.stok+' '+esc(p.satuan||"pcs")+'</small></button>'}).join("")+'</section>';
  if(!list.length)h+='<div class="card empty">Tidak ada barang yang cocok dengan “'+esc(S.q)+'”.</div>';

}
function vUtang(){
  const tp=totalPiutang();
  const rows=S.pelanggan.map(p=>({p,s:saldoPel(p.id),d:dueInfo(p.id)})).sort((a,b)=>b.s-a.s||a.p.nama.localeCompare(b.p.nama));
  let h='<section class="sec"><div class="sec-head"><h2>Utang Piutang</h2><button class="btn sm" type="button" data-act="pelBaru">+ Pelanggan</button></div>'+
    '<div class="grid2"><div class="stat"><span class="label">Pelanggan berutang</span><b class="num warn">'+rp(tp)+'</b></div><div class="stat"><span class="label">Jumlah pelanggan</span><b class="num">'+S.pelanggan.length+'</b></div></div></section>';
  if(!rows.length)return h+'<div class="card empty">Belum ada pelanggan. Tambahkan pelanggan untuk mulai mencatat utang.</div>';
  const now=Date.now();
  h+='<div class="list">'+rows.map(({p,s,d})=>{let tag="";if(s>0&&d){tag=d<sod(now)?'<span class="pill r">Lewat tempo</span>':'<span class="pill n">Tempo '+fmtD(d)+'</span>'}else if(s<=0)tag='<span class="pill g">Lunas</span>';
    return '<div class="row tap" data-act="pel" data-id="'+p.id+'"><div class="av">'+esc(initials(p.nama))+'</div><div class="main"><b>'+esc(p.nama)+'</b><small>'+tag+'</small></div><div class="amt num '+(s>0?"warn":s<0?"pos":"")+'">'+rp(Math.abs(s))+(s<0?'<br><small style="font-weight:500">titip/lebih bayar</small>':'')+'</div></div>'}).join("")+'</div>';
  return h;
}
function vKas(){
  const r=range(S.periode);const f=S.kasFilter;
  const list=kasEntries().filter(e=>inR(e.t,r)&&(f==="semua"||e.jenis===f));
  const m=list.filter(e=>e.jenis==="masuk").reduce((a,e)=>a+e.jumlah,0),k=list.filter(e=>e.jenis==="keluar").reduce((a,e)=>a+e.jumlah,0);
  return '<section class="sec"><div class="sec-head"><h2>Buku Kas</h2></div>'+periodChips()+
   '<div class="grid2"><div class="stat"><span class="label">Pemasukan</span><b class="num pos">'+rp(m)+'</b></div><div class="stat"><span class="label">Pengeluaran</span><b class="num neg">'+rp(k)+'</b></div></div>'+
   '<div class="split"><button class="btn" type="button" data-act="kas" data-jenis="masuk">+ Pemasukan</button><button class="btn red" type="button" data-act="kas" data-jenis="keluar">− Pengeluaran</button></div>'+
   '<div class="chips">'+[["semua","Semua"],["masuk","Masuk"],["keluar","Keluar"]].map(([k,l])=>'<button class="chip" type="button" data-kf="'+k+'" aria-pressed="'+(f===k)+'">'+l+'</button>').join("")+'</div></section>'+
   (list.length?'<div class="list">'+list.map(rowKas).join("")+'</div>':'<div class="card empty">Tidak ada transaksi pada periode ini.</div>');
}
function periodChips(){return '<div class="chips">'+[["hari","Hari ini"],["minggu","7 hari"],["bulan","Bulan ini"],["semua","Semua"]].map(([k,l])=>'<button class="chip" type="button" data-per="'+k+'" aria-pressed="'+(S.periode===k)+'">'+l+'</button>').join("")+'</div>'}
function vStok(){
  const q=S.q.trim().toLowerCase();
  const list=S.produk.filter(p=>!q||p.nama.toLowerCase().includes(q)).sort((a,b)=>a.nama.localeCompare(b.nama));
  const nilai=S.produk.reduce((a,p)=>a+(p.modal||0)*Math.max(0,p.stok||0),0);
  let h='<section class="sec"><div class="sec-head"><h2>Stok Barang</h2><button class="btn sm" type="button" data-act="addProduk">+ Barang</button></div>'+
   '<div class="grid2"><div class="stat"><span class="label">Jenis barang</span><b class="num">'+S.produk.length+'</b></div><div class="stat"><span class="label">Nilai stok (modal)</span><b class="num">'+rp(nilai)+'</b></div></div>'+
   '<input id="qProduk" type="search" placeholder="Cari barang…" value="'+esc(S.q)+'" autocomplete="off"></section>';
  if(!list.length)return h+'<div class="card empty">'+(S.produk.length?'Tidak ada barang yang cocok.':'Belum ada barang. Tekan “+ Barang” untuk menambah.')+'</div>';
  return h+'<div class="list">'+list.map(p=>{const min=p.minStok!=null?p.minStok:S.toko.minStok||5;const st=p.stok<=0?'<span class="pill r">Habis</span>':p.stok<=min?'<span class="pill a">Menipis</span>':'';
    return '<div class="row"><div class="main tap" data-act="editProduk" data-id="'+p.id+'" style="cursor:pointer"><b>'+esc(p.nama)+'</b><small class="num">Jual '+rp(p.harga)+' · Modal '+rp(p.modal)+'</small> '+st+'</div><div class="stepper"><button type="button" data-act="stok" data-d="-1" data-id="'+p.id+'" aria-label="Kurangi stok">−</button><b class="num" style="min-width:34px;text-align:center">'+p.stok+'</b><button type="button" data-act="stok" data-d="1" data-id="'+p.id+'" aria-label="Tambah stok">+</button></div></div>'}).join("")+'</div>';
}
function vLaporan(){
  const L=laporan(S.periode);
  const days=[];const t0=sod(Date.now());
  for(let i=6;i>=0;i--){const a=t0-i*DAY;let s=0;for(const j of S.jual)if(j.tgl>=a&&j.tgl<a+DAY)s+=j.total;days.push({a,s})}
  const mx=Math.max(1,...days.map(d=>d.s));
  const short=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+"jt":n>=1e3?Math.round(n/1e3)+"rb":String(n);
  const lines=[["Penjualan",L.omzet,""],["Modal barang terjual",-L.modal,""],["Laba kotor",L.labaKotor,"b"],["Pemasukan lain",L.masukLain,""],["Pengeluaran",-L.keluar,""],["Laba bersih",L.labaBersih,"b"]];
  return '<section class="sec"><div class="sec-head"><h2>Laporan Keuangan</h2><button class="btn sm ghost" type="button" data-act="csv">Unduh CSV</button></div>'+periodChips()+'</section>'+
   '<section class="grid2"><div class="stat"><span class="label">Jumlah transaksi</span><b class="num">'+L.trx+'</b></div><div class="stat"><span class="label">Utang dilunasi</span><b class="num pos">'+rp(L.lunas)+'</b></div></section>'+
   '<section class="card sec"><h3>Laba rugi</h3><div>'+lines.map(([l,v,b])=>'<div class="nota-ln" style="display:flex;justify-content:space-between;padding:7px 0;border-top:'+(b?"1px solid var(--line)":"0")+';font-weight:'+(b?800:500)+'"><span>'+l+'</span><span class="num '+(b?(v>=0?"pos":"neg"):"")+'">'+(v<0?"−":"")+rp(Math.abs(v))+'</span></div>').join("")+'</div></section>'+
   '<section class="card sec"><h3>Penjualan 7 hari terakhir</h3><div class="bars">'+days.map((d,i)=>'<div class="bar"><em class="num">'+(d.s?short(d.s):"")+'</em><i class="'+(i===6?"today":"")+'" style="height:'+Math.round(d.s/mx*100)+'%"></i><span>'+new Date(d.a).toLocaleDateString("id-ID",{weekday:"short"})+'</span></div>').join("")+'</div></section>'+
   '<section class="grid2" style="align-items:start"><div class="card sec" style="min-width:0"><h3>Barang terlaris</h3>'+(L.top.length?L.top.map(([n,q],i)=>'<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(i+1)+'. '+esc(n)+'</span><b class="num">'+q+'</b></div>').join(""):'<small style="color:var(--muted)">Belum ada penjualan.</small>')+'</div>'+
   '<div class="card sec" style="min-width:0"><h3>Pengeluaran per kategori</h3>'+(L.katK.length?L.katK.map(([n,v])=>'<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>'+esc(n)+'</span><b class="num">'+rp(v)+'</b></div>').join(""):'<small style="color:var(--muted)">Belum ada pengeluaran.</small>')+'</div></section>';
}

/* ---------- sheet ---------- */
function openSheet(title,body,onMount){
  $("#sheetRoot").innerHTML='<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-head"><h2>'+esc(title)+'</h2><button class="x" type="button" data-act="close" aria-label="Tutup">×</button></div>'+body+'</div></div>';
  const first=$("#sheetRoot input:not([type=hidden]),#sheetRoot select");if(first&&window.innerWidth>640)first.focus();
  if(onMount)onMount($("#sheetRoot .sheet"));
}
function closeSheet(){$("#sheetRoot").innerHTML=""}
function toast(m){$("#toastRoot").innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{$("#toastRoot").innerHTML=""},2400)}
function confirmBtn(btn,label,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3000)}
async function guard(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){console.error(e);toast(errMsg(e))}finally{if(btn&&btn.isConnected)btn.disabled=false}}

function sheetProduk(p){
  p=p||{};
  openSheet(p.id?"Ubah barang":"Tambah barang",'<form class="stack" id="fProduk">'+
   '<label class="f">Nama barang<input id="pNama" required value="'+esc(p.nama||"")+'" placeholder="mis. Gula pasir 1 kg"></label>'+
   '<div class="grid2"><label class="f">Harga jual (Rp)<input id="pHarga" inputmode="numeric" required value="'+(p.harga||"")+'"></label><label class="f">Harga modal (Rp)<input id="pModal" inputmode="numeric" value="'+(p.modal||"")+'"></label></div>'+

function notaText(j,cash,pel){
  const p=pel?S.pelanggan.find(x=>x.id===pel):null;

  for(const x of j.items)t+=x.nama+"\n  "+x.qty+" x "+rp(x.harga)+" = "+rp(x.qty*x.harga)+"\n";

  if(j.metode==="tunai"&&cash!=null){t+="Tunai "+rp(cash)+"\nKembali "+rp(cash-j.total)+"\n"}

/* ---------- sample data ---------- */
function sampleData(){
  const P=[["Beras premium 5 kg",78000,70000,14,"karung"],["Minyak goreng 1 L",19000,16500,22,"botol"],["Gula pasir 1 kg",18000,15500,4,"kg"],["Telur ayam 1 kg",30000,27000,9,"kg"],["Mi instan goreng",3500,2900,58,"bks"],["Kopi sachet",1500,1100,120,"sachet"],["Air mineral 600 ml",4000,2800,36,"botol"],["Gas LPG 3 kg",23000,20000,3,"tabung"],["Sabun cuci piring 800 ml",15000,12500,11,"botol"],["Teh celup isi 25",8000,6500,15,"kotak"]];
  const produk=P.map(([nama,harga,modal,stok,satuan])=>({id:uid(),nama,harga,modal,stok,satuan,minStok:5,contoh:true}));
  const pelanggan=[["Bu Sari","081234567890"],["Pak Made","085737001122"],["Kadek Ayu","087861234455"],["Mas Joko",""]].map(([nama,hp])=>({id:uid(),nama,hp,contoh:true}));
  const jual=[],kas=[],utang=[];const t0=sod(Date.now());
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  for(let d=6;d>=0;d--){const n=3+Math.floor(rnd()*4);for(let i=0;i<n;i++){
    const t=t0-d*DAY+(7+Math.floor(rnd()*13))*3600000+Math.floor(rnd()*59)*60000;if(t>Date.now())continue;
    const k=1+Math.floor(rnd()*3);const items=[];for(let x=0;x<k;x++){const p=produk[Math.floor(rnd()*produk.length)];if(items.find(y=>y.pid===p.id))continue;const q=1+Math.floor(rnd()*3);items.push({pid:p.id,nama:p.nama,qty:q,harga:p.harga,modal:p.modal})}
    const total=items.reduce((a,x)=>a+x.harga*x.qty,0),modal=items.reduce((a,x)=>a+x.modal*x.qty,0);
    const m=rnd()<.2?"transfer":"tunai";jual.push({id:uid(),tgl:t,items,total,modal,bayar:"lunas",metode:m,contoh:true})}}
  const K=[[5,"keluar",450000,"Belanja stok","Kulakan beras & minyak"],[4,"keluar",185000,"Listrik & air","Token listrik"],[3,"masuk",500000,"Modal tambahan","Tambah modal dari tabungan"],[2,"keluar",60000,"Transportasi","Bensin ambil barang"],[1,"keluar",320000,"Belanja stok","Kulakan gula & telur"],[0,"keluar",25000,"Pulsa & internet","Paket data"]];
  for(const [d,jenis,jumlah,kategori,catatan] of K)kas.push({id:uid(),tgl:t0-d*DAY+10*3600000,jenis,jumlah,kategori,catatan,contoh:true});
  const U=[[0,"berikan",156000,6,"Beras 5 kg, minyak, telur",2],[0,"terima",50000,3,"Cicilan"],[1,"berikan",46000,4,"Gas LPG + gula",-1],[2,"berikan",87500,1,"Belanja harian",5],[2,"terima",87500,0,"Lunas"]];
  for(const [pi,jenis,jumlah,d,catatan,due] of U){const u={id:uid(),pelangganId:pelanggan[pi].id,jenis,jumlah,catatan,tgl:t0-d*DAY+15*3600000,asal:"manual",contoh:true};if(due!=null)u.jatuhTempo=t0+due*DAY+23*3600000;utang.push(u)}
  return{produk,pelanggan,jual,kas,utang};
}

/* ---------- CSV ---------- */
async function exportCsv(){
  const r=range(S.periode);const rows=[["Tanggal","Jenis","Kategori","Keterangan","Jumlah"]];
  for(const e of kasEntries().filter(e=>inR(e.t,r)).reverse())rows.push([new Date(e.t).toLocaleString("id-ID"),e.jenis==="masuk"?"Pemasukan":"Pengeluaran",e.kat,e.ket,e.jumlah]);
  const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  try{await saveFile("laporan-kas-"+toInputDate(Date.now())+".csv",csv,"text/csv")}catch(e){console.error(e);toast("Gagal menyimpan file")}
}

/* ---------- cadangan & lisensi di pengaturan ---------- */
async function backup(){
  const out={aplikasi:"catat-toko",versi:1,dibuat:new Date().toISOString(),toko:S.toko};for(const c of COLS)out[c]=S[c];
  try{await saveFile("cadangan-"+(S.toko.nama||"toko").replace(/[^a-z0-9]+/gi,"-").toLowerCase()+"-"+toInputDate(Date.now())+".json",JSON.stringify(out),"application/json");toast("Cadangan dibuat")}catch(e){console.error(e);toast("Gagal membuat cadangan")}
}
function restoreFile(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.aplikasi!=="catat-toko")throw new Error("bukan cadangan");
    if(d.toko)S.toko=Object.assign({nama:"Toko Saya",minStok:5},d.toko);for(const c of COLS)S[c]=Array.isArray(d[c])?d[c]:[];
    S.cart={};persist();closeSheet();render();toast("Data dipulihkan dari cadangan")}catch(e){toast("File ini bukan cadangan Catat Toko")}};
  r.readAsText(file);
}
function licSection(){
  if(!CFG.LICENSE_ENABLED)return "";
  const L=licState();
  if(L.status==="aktif")return '<div class="sec"><span class="label">Lisensi</span><div class="stat"><span class="pill g">Aktif</span><small class="num" style="display:block;color:var(--muted);margin-top:6px">ID perangkat '+esc(L.dev)+'</small></div></div>';
  const wa=waLisensi();
  return '<div class="sec"><span class="label">Lisensi</span><div class="stat"><span class="pill a">Masa coba: sisa '+L.sisa+' hari</span><small style="display:block;color:var(--muted);margin-top:6px">ID perangkat <b class="num" id="devId2">'+esc(L.dev)+'</b></small></div>'+
   '<div class="split"><button class="btn ghost sm" type="button" data-act="copy" data-target="devId2">Salin ID</button>'+(wa?'<button class="btn ghost sm" type="button" data-act="ext" data-url="'+esc(wa)+'">Minta kode via WA</button>':'')+'</div>'+
   '<form class="stack" id="fAkt2"><label class="f">Kode aktivasi<textarea id="aKey2" rows="4" placeholder="Tempel kode aktivasi yang Anda terima lewat WhatsApp" autocomplete="off" spellcheck="false" style="text-transform:uppercase;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px"></textarea></label><button class="btn" type="submit">Aktifkan</button></form></div>';
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-per],[data-kf]");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.q="";closeSheet();render();window.scrollTo(0,0);return}
  if(t.dataset.per){S.periode=t.dataset.per;render();return}
  if(t.dataset.kf){S.kasFilter=t.dataset.kf;render();return}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==="closeScrim"){if(e.target===t)closeSheet();return}
  if(a==="close")return closeSheet();
  if(a==="addProduk")return sheetProduk();
  if(a==="editProduk")return sheetProduk(S.produk.find(p=>p.id===id));
  if(a==="kas")return sheetKas(t.dataset.jenis);
  if(a==="kasDetail")return sheetKas(null,S.kas.find(k=>k.id===id));
  if(a==="pel")return sheetPelanggan(id);
  if(a==="pelBaru")return sheetPelBaru();
  if(a==="pelBaruThen")return sheetPelBaru(nid=>sheetUtangEntry(nid,"berikan"));
  if(a==="utangBaru")return sheetPilihPelanggan();
  if(a==="utEntry")return sheetUtangEntry(id,t.dataset.jenis);
  if(a==="delUt")return confirmBtn(t,"Hapus?",()=>guard(t,async()=>{await delDoc("utang",id);sheetPelanggan(t.dataset.pid);toast("Catatan dihapus")}));
  if(a==="addCart"){const p=S.produk.find(x=>x.id===id);if(!p)return;S.cart[id]=(S.cart[id]||0)+1;if(S.cart[id]>p.stok)toast("Stok "+p.nama+" tinggal "+p.stok);render();return}
  if(a==="checkout")return sheetCheckout();
  if(a==="cq"){S.cart[id]=(S.cart[id]||0)+Number(t.dataset.d);if(S.cart[id]<=0)delete S.cart[id];render();sheetCheckout();return}
  if(a==="stok"){const p=S.produk.find(x=>x.id===id);if(!p)return;const v=Math.max(0,(p.stok||0)+Number(t.dataset.d));p.stok=v;render();clearTimeout(stokTimers[id]);stokTimers[id]=setTimeout(()=>guard(null,()=>updDoc("produk",id,{stok:v})),600);return}
  if(a==="seed")return seedLive(t);
  if(a==="csv")return exportCsv();
  if(a==="ext")return openExternal(t.dataset.url);
  if(a==="backup")return backup();
  if(a==="restore"){const f=$("#fRestore");if(f)f.click();return}
  if(a==="copy"){const el=document.getElementById(t.dataset.target);const txt=el?el.textContent:"";
    try{navigator.clipboard.writeText(txt).then(()=>toast("Disalin"),()=>selectEl(el))}catch(_){selectEl(el)}return}
});
const stokTimers={};
function selectEl(el){if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Teks dipilih, salin manual")}
document.addEventListener("input",e=>{if(e.target.id==="qProduk"){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#qProduk");if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("#btnSettings").addEventListener("click",sheetSettings);

/* ---------- boot ---------- */
function boot(){
  loadLocal();S.mode="live";render();
  if(isNative()&&window.Capacitor.Plugins.App){window.Capacitor.Plugins.App.addListener("backButton",()=>{if($("#sheetRoot").innerHTML)closeSheet();else if(S.tab!=="beranda"){S.tab="beranda";render()}else window.Capacitor.Plugins.App.exitApp()})}
}
boot();
})();
</script>
