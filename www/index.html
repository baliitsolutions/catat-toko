<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7A5C">
<title>Catat Toko</title>
<script src="config.js"></script>
<script src="vendor/nacl-fast.min.js"></script>
<style>
@font-face{font-family:"Plus Jakarta Sans";font-weight:400;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:500;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:600;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:700;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Plus Jakarta Sans";font-weight:800;font-display:swap;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format("woff2")}
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: laptop = menu samping hijau tua + area kerja lebar (dashboard 2 kolom, kasir dengan panel keranjang);
   HP = satu kolom dengan header ringkas dan menu bawah. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --sunk:#E9F0ED; --ink:#12231E; --muted:#5D706A; --line:#DDE6E2;
  --accent:#0E7A5C; --accent-2:#13A079; --accent-ink:#FFFFFF; --accent-soft:#DCF2E9;
  --amber:#A85A08; --amber-soft:#FDEBD3; --red:#C0313E; --red-soft:#FDE3E4;
  --side-a:#0F4A3A; --side-b:#0A3027; --side-ink:#E6F3EE; --side-muted:#9CBDB1;
  --hero-a:#0E7A5C; --hero-b:#16A37E; --hero-ink:#FFFFFF;
  --t-green-bg:#DCF2E9; --t-green:#0E7A5C; --t-blue-bg:#E0EAFF; --t-blue:#2457C5;
  --t-amber-bg:#FDEBD3; --t-amber:#A85A08; --t-rose-bg:#FDE3E4; --t-rose:#C0313E;
  --t-violet-bg:#ECE5FF; --t-violet:#6A42C2; --t-teal-bg:#D7F1F2; --t-teal:#0F7A80;
  --shadow:0 1px 2px rgba(18,35,30,.05),0 8px 24px rgba(18,35,30,.06);
  --shadow-lg:0 10px 30px rgba(14,122,92,.25);
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141E1B; --sunk:#1A2723; --ink:#E5EFEA; --muted:#93A7A0; --line:#24332E;
  --accent:#3DC79A; --accent-2:#2FB287; --accent-ink:#04201A; --accent-soft:#12392D;
  --amber:#F0A64E; --amber-soft:#3A2913; --red:#FF8A92; --red-soft:#3D1A1D;
  --side-a:#0B2E25; --side-b:#071C17; --side-ink:#E6F3EE; --side-muted:#8BAA9F;
  --hero-a:#0B5E47; --hero-b:#11866A; --hero-ink:#FFFFFF;
  --t-green-bg:#12392D; --t-green:#3DC79A; --t-blue-bg:#172A4A; --t-blue:#8DB2FF;
  --t-amber-bg:#3A2913; --t-amber:#F0A64E; --t-rose-bg:#3D1A1D; --t-rose:#FF8A92;
  --t-violet-bg:#2A2147; --t-violet:#B79CFF; --t-teal-bg:#123537; --t-teal:#5CD3D9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141E1B; --sunk:#1A2723; --ink:#E5EFEA; --muted:#93A7A0; --line:#24332E;
  --accent:#3DC79A; --accent-2:#2FB287; --accent-ink:#04201A; --accent-soft:#12392D;
  --amber:#F0A64E; --amber-soft:#3A2913; --red:#FF8A92; --red-soft:#3D1A1D;
  --side-a:#0B2E25; --side-b:#071C17; --side-ink:#E6F3EE; --side-muted:#8BAA9F;
  --hero-a:#0B5E47; --hero-b:#11866A; --hero-ink:#FFFFFF;
  --t-green-bg:#12392D; --t-green:#3DC79A; --t-blue-bg:#172A4A; --t-blue:#8DB2FF;
  --t-amber-bg:#3A2913; --t-amber:#F0A64E; --t-rose-bg:#3D1A1D; --t-rose:#FF8A92;
  --t-violet-bg:#2A2147; --t-violet:#B79CFF; --t-teal-bg:#123537; --t-teal:#5CD3D9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.d-only{display:none}

/* ---------- kerangka ---------- */
.side{display:none}
.shell{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.content{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;box-shadow:0 4px 12px rgba(14,122,92,.25)}
.brand h1{font-size:18px;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.top-r{display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 11px;font:600 13px var(--font);cursor:pointer}
.iconbtn svg{width:19px;height:19px;stroke:currentColor}
.iconbtn span{display:none}
.lic-chip{display:none}

/* ---------- teks & kartu ---------- */
h2{font-size:22px;margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.015em}
h3{font-size:15px;margin:0;font-weight:700}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;flex-wrap:wrap}
.panel-head small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.panel-body{padding:0 18px 18px}
.panel .list{border:0;border-radius:0;border-top:1px solid var(--line)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pagehead small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- hero & KPI ---------- */
.dash-top{display:grid;gap:14px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a) 0%,var(--hero-b) 100%);color:var(--hero-ink);border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;box-shadow:var(--shadow-lg);min-height:170px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero::before{width:240px;height:240px;right:-70px;top:-90px}
.hero::after{width:150px;height:150px;right:60px;bottom:-80px;background:rgba(255,255,255,.06)}
.hero>*{position:relative}
.hero .label{color:inherit;opacity:.85}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.hero-sub{font-size:13px;opacity:.85}
.hero-foot{display:flex;gap:8px;flex-wrap:wrap}
.hero-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero-mini div{background:rgba(255,255,255,.13);border-radius:12px;padding:10px 12px;min-width:0}
.hero-mini span{display:block;font-size:11.5px;opacity:.85}
.hero-mini b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 13px;font:700 13px var(--font);cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.22)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi-ic svg{width:20px;height:20px;stroke:currentColor}
.kpi-tx{min-width:0}
.kpi-tx>span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.kpi-tx>b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px;overflow-wrap:anywhere}
.kpi-tx small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
small.up,.up{color:var(--accent)!important;font-weight:700}
small.down,.down{color:var(--red)!important;font-weight:700}
.t-green{background:var(--t-green-bg);color:var(--t-green)} .t-blue{background:var(--t-blue-bg);color:var(--t-blue)}
.t-amber{background:var(--t-amber-bg);color:var(--t-amber)} .t-rose{background:var(--t-rose-bg);color:var(--t-rose)}
.t-violet{background:var(--t-violet-bg);color:var(--t-violet)} .t-teal{background:var(--t-teal-bg);color:var(--t-teal)}

/* ---------- aksi cepat ---------- */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.qt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px;font-family:var(--font);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:transform .12s ease,box-shadow .12s ease}
.qt:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.qt .kpi-ic{width:44px;height:44px;border-radius:14px}
.qt .kpi-ic svg{width:22px;height:22px}
.qt b{font-size:12.5px;font-weight:700}
.qt small{display:none;color:var(--muted);font-size:12px}

/* ---------- grid dashboard ---------- */
.dash-grid{display:grid;gap:18px}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}

/* ---------- daftar ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.tap{cursor:pointer}
.row.tap:hover{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main small{color:var(--muted);font-size:12.5px}
.row .amt{font-weight:750;text-align:right;white-space:nowrap}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;background:var(--sunk);color:var(--muted)}
.av svg{width:19px;height:19px;stroke:currentColor}
.c0{background:var(--t-green-bg);color:var(--t-green)} .c1{background:var(--t-blue-bg);color:var(--t-blue)} .c2{background:var(--t-amber-bg);color:var(--t-amber)}
.c3{background:var(--t-rose-bg);color:var(--t-rose)} .c4{background:var(--t-violet-bg);color:var(--t-violet)} .c5{background:var(--t-teal-bg);color:var(--t-teal)}
.pos{color:var(--accent)} .neg{color:var(--red)} .warn{color:var(--amber)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.g{background:var(--accent-soft);color:var(--accent)} .pill.a{background:var(--amber-soft);color:var(--amber)} .pill.r{background:var(--red-soft);color:var(--red)} .pill.n{background:var(--sunk);color:var(--muted)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:34px;height:34px;stroke:currentColor;opacity:.6}
.empty p{margin:0}

/* ---------- tombol & form ---------- */
.btn{border:0;border-radius:12px;padding:12px 16px;font:700 14px var(--font);cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px;stroke:currentColor}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.amber{background:var(--amber);color:#fff}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-size:18px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
input,select,textarea{width:100%;font:500 15px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
form.stack{display:flex;flex-direction:column;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);pointer-events:none}
.search input{padding-left:40px;background:var(--surface);border-radius:12px}

/* ---------- kasir ---------- */
.kasir-wrap{display:grid;gap:18px;align-items:start}
.kasir-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prod{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;cursor:pointer;font-family:var(--font);color:var(--ink);display:flex;flex-direction:column;gap:8px;position:relative;min-width:0;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease}
.prod:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.prod.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prod-tile{height:74px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800;position:relative}
.prod b{font-size:13.5px;font-weight:650;line-height:1.3;min-height:2.6em}
.prod-foot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.prod .price{font-weight:800;color:var(--accent);font-size:14px}
.prod .stk{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.prod .stk.low{color:var(--amber)}
.prod .qty{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:12.5px;font-weight:800;padding:0 7px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.prod[data-out="1"]{opacity:.5}
.cartpanel{display:none}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px;border-top:1px dashed var(--line);font-weight:700}
.cart-total b{font-size:22px;font-weight:800}
.cart-pay{padding:0 18px 18px}
.cartbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.cartbar .in{max-width:760px;margin:0 auto;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:16px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow-lg);cursor:pointer;border:0;width:100%;font-family:var(--font);font-size:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 16px var(--font);cursor:pointer}

/* ---------- grafik ---------- */
.chart{position:relative;padding-top:22px}
.gridl{position:absolute;left:0;right:0;top:22px;height:160px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.gridl i{display:block;border-top:1px dashed var(--line)}
.bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.bar{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bar .colb{position:relative;width:100%;height:160px;display:flex;align-items:flex-end;justify-content:center}
.bar i{display:block;width:100%;max-width:44px;background:linear-gradient(180deg,var(--accent-2),var(--accent));opacity:.55;border-radius:8px 8px 3px 3px;position:relative}
.bar.today i{opacity:1}
.bar em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:4px;font-style:normal;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.bar.today em{color:var(--ink)}
.bar span{font-size:11.5px;color:var(--muted);font-weight:600}
.bar.today span{color:var(--accent);font-weight:800}
.prog{display:flex;flex-direction:column;gap:12px}
.prog-row{display:flex;flex-direction:column;gap:5px}
.prog-row div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.prog-row div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog-row .track{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden;display:block}
.prog-row .track i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.prog-row .track i.rose{background:var(--t-rose)}
.lr{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.lr.b{border-top:1px solid var(--line);font-weight:800;font-size:15px}

/* ---------- menu bawah (HP) ---------- */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.05);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.bottom button{background:none;border:0;padding:8px 2px 10px;font:600 11px var(--font);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.bottom button svg{width:22px;height:22px;stroke:currentColor;padding:3px 12px;box-sizing:content-box;border-radius:999px}
nav.bottom button[aria-current="page"]{color:var(--accent);font-weight:800}
nav.bottom button[aria-current="page"] svg{background:var(--accent-soft)}
svg.i{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- sheet, toast, lain-lain ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{background:var(--sunk);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--ink);font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:30;max-width:90vw;box-shadow:var(--shadow)}
#banner:empty{display:none}
.searchrow{display:flex;gap:8px;align-items:stretch}
.searchrow>.search,.searchrow>input{flex:1;min-width:0}
.scanbtn{padding:0 13px;flex:none}
.scanbtn svg{width:22px;height:22px}
.err-msg{color:var(--red);font-size:13px;font-weight:600;min-height:1em}
.login{max-width:520px;margin:8vh auto 0;display:flex;flex-direction:column;gap:16px}
.login>.kpi-ic{width:52px;height:52px;border-radius:16px}.login>.kpi-ic svg{width:26px;height:26px}
.users{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ucard{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-family:var(--font)}
.ucard small{color:var(--muted);font-size:12px}
.ucard.on{border-color:var(--accent);background:var(--accent-soft)}
input.pin{font-size:24px;letter-spacing:.35em;text-align:center}
.code-box{font:800 26px ui-monospace,Consolas,monospace;letter-spacing:.12em;text-align:center;background:var(--accent-soft);border-radius:12px;padding:16px;user-select:all}
.row.ed{flex-wrap:wrap}
label.mini{display:flex;flex-direction:column;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);width:96px}
label.mini input{padding:8px 9px;font-size:14px;text-align:right}
.opn .main small span{font-weight:800}
.row-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row-banner span{flex:1;min-width:200px}
.seg .chip{font-weight:700}
.papers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paper{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;text-align:left;font-family:var(--font);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.paper b{font-size:13.5px}.paper small{font-size:11.5px;color:var(--muted)}
.paper[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.linkbtn{background:none;border:0;color:var(--accent);font:700 13px var(--font);cursor:pointer;padding:4px;align-self:center}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600}
.nota{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;font-size:13px}
.nota .ln{display:flex;justify-content:space-between;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.toggle button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;font:600 13px var(--font);cursor:pointer}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',

 truck:'<path d="M1 4h14v12H1zM15 9h4l3 3v4h-7z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/>',

};

/* ---------- state ---------- */
const S={mode:"loading",toko:{nama:"Toko Saya",pemilik:"",hp:"",minStok:5},produk:[],jual:[],kas:[],pelanggan:[],utang:[],
  supplier:[],beli:[],hutsup:[],opname:[],pengguna:[],
  cart:{},tab:"beranda",periode:"hari",q:"",kat:"",stokView:"barang",kasFilter:"semua",user:null,loginSel:"",loaded:{},stale:false};
const COLS=["produk","jual","kas","pelanggan","utang","supplier","beli","hutsup","opname","pengguna"];
const DATA_COLS=["produk","jual","kas","pelanggan","utang","supplier","beli","hutsup","opname"];
const CFG=Object.assign({APP_NAME:"Catat Toko",TRIAL_DAYS:30,LICENSE_ENABLED:true,LICENSE_PUBLIC_KEY:"",KONTAK_WA:"",KONTAK_NAMA:""},window.CATAT_CONFIG||{});
const KEY_DATA="catattoko.data.v1";

/* ---------- data layer (disimpan di perangkat) ---------- */
function persist(){
  const out={versi:1,toko:S.toko};for(const c of COLS)out[c]=S[c];
  try{localStorage.setItem(KEY_DATA,JSON.stringify(out));return true}
  catch(e){console.error(e);toast("Penyimpanan perangkat penuh. Buat cadangan lalu hapus data lama.");return false}
}
function loadLocal(){
  try{const raw=localStorage.getItem(KEY_DATA);if(!raw)return false;const d=JSON.parse(raw);
    if(d.toko)S.toko=Object.assign({nama:"Toko Saya",minStok:5},d.toko);for(const c of COLS)S[c]=Array.isArray(d[c])?d[c]:[];return true}
  catch(e){console.error(e);return false}
}
async function addDoc(col,data){const id=uid();S[col].push(Object.assign({id},data));persist();render();return id}
async function updDoc(col,id,data){const o=S[col].find(x=>x.id===id);if(o)Object.assign(o,data);persist();render()}
async function delDoc(col,id){S[col]=S[col].filter(x=>x.id!==id);persist();render()}
async function saveToko(data){Object.assign(S.toko,data);persist();render()}
function errMsg(){return "Gagal menyimpan. Coba lagi."}

/* ---------- simpan file (Windows/Android/browser) ---------- */
function isNative(){return !!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform())}
async function saveFile(filename,text,mime){
  if(isNative()){
    const P=window.Capacitor.Plugins;
    const r=await P.Filesystem.writeFile({path:filename,data:text,directory:"CACHE",encoding:"utf8"});
    try{await P.Share.share({title:filename,url:r.uri,dialogTitle:"Simpan atau kirim "+filename})}catch(_){}
    return;
  }
  const blob=new Blob([text],{type:mime||"text/plain"});const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function openExternal(url){
  if(isNative()&&window.Capacitor.Plugins.Browser){window.Capacitor.Plugins.Browser.open({url});return}
  window.open(url,"_blank","noopener");
}

/* ---------- lisensi ---------- */
/* Kode lisensi = tanda tangan Ed25519 atas "CATATTOKO|<ID perangkat>", ditulis dalam base32 Crockford.
   Aplikasi ini hanya menyimpan KUNCI PUBLIK, jadi tidak bisa membuat kode sendiri. */
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function b32enc(bytes){let bits=0,val=0,out="";for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(str){const s=String(str||"").toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");let bits=0,val=0;const out=[];
  for(const ch of s){const i=B32.indexOf(ch);if(i<0)return null;val=((val<<5)|i)&0xffff;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
function licMsg(dev){return new Uint8Array(new TextEncoder().encode("CATATTOKO|"+dev))}
function verifyKey(code,dev){
  try{if(!window.nacl||!CFG.LICENSE_PUBLIC_KEY)return false;const pub=b32dec(CFG.LICENSE_PUBLIC_KEY);const sig=b32dec(code);
    if(!pub||pub.length!==32||!sig||sig.length<64)return false;return window.nacl.sign.detached.verify(licMsg(dev),sig.slice(0,64),pub)}catch(e){return false}
}
function deviceId(){
  let d=null;try{d=localStorage.getItem("catattoko.device")}catch(_){}
  if(!d){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let r="";const a=new Uint32Array(12);crypto.getRandomValues(a);for(let i=0;i<12;i++){r+=ch[a[i]%ch.length];if(i===3||i===7)r+="-"}d=r;try{localStorage.setItem("catattoko.device",d)}catch(_){}}
  return d;
}
function licState(){
  if(!CFG.LICENSE_ENABLED)return{status:"aktif",sisa:Infinity};
  const dev=deviceId();let key="",first=0;
  try{key=localStorage.getItem("catattoko.key")||"";first=Number(localStorage.getItem("catattoko.first"))||0}catch(_){}
  if(!first){first=Date.now();try{localStorage.setItem("catattoko.first",String(first))}catch(_){}}
  if(key&&verifyKey(key,dev))return{status:"aktif",sisa:Infinity,dev};
  const sisa=Math.ceil((first+CFG.TRIAL_DAYS*DAY-Date.now())/DAY);
  return{status:sisa>0?"trial":"habis",sisa:Math.max(0,sisa),dev};
}
/* activate: "" jika berhasil, selain itu pesan penyebabnya */
function kunciId(){return (CFG.LICENSE_PUBLIC_KEY||"").slice(0,8)||"-"}
function activate(input){
  const code=String(input||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(!CFG.LICENSE_PUBLIC_KEY)return "Aplikasi ini versi lama tanpa kunci lisensi. Install versi terbaru dari penjual.";
  if(!window.nacl)return "Komponen lisensi tidak termuat. Install ulang aplikasi.";
  if(!code)return "Tempel kode aktivasi dulu.";
  if(code.length<103)return "Kode belum lengkap ("+code.length+" dari 103 huruf). Salin seluruh kode dari pesan WhatsApp.";
  if(!verifyKey(code,deviceId()))return "Kode tidak cocok untuk ID "+deviceId()+" dan kunci "+kunciId()+". Pastikan penjual membuat kode untuk ID ini dengan kunci yang sama.";
  try{localStorage.setItem("catattoko.key",code)}catch(_){}return "";
}

/* ---------- derived ---------- */
function range(p){const now=Date.now(),t=sod(now);
  if(p==="hari")return[t,now+DAY];if(p==="minggu")return[t-6*DAY,now+DAY];
  if(p==="bulan"){const d=new Date(t);d.setDate(1);return[d.getTime(),now+DAY]}
  return[0,now+DAY]}
const inR=(t,[a,b])=>t>=a&&t<b;
function saldoPel(pid){let s=0;for(const u of S.utang)if(u.pelangganId===pid)s+=u.jenis==="berikan"?u.jumlah:-u.jumlah;return s}
function totalPiutang(){return S.pelanggan.reduce((a,p)=>{const s=saldoPel(p.id);return a+(s>0?s:0)},0)}
function kasEntries(){
  const out=[];
  for(const j of S.jual)if(j.bayar!=="utang")out.push({t:j.tgl,jenis:"masuk",jumlah:j.total,ket:"Penjualan"+(j.metode&&j.metode!=="tunai"?" ("+j.metode+")":""),kat:"Penjualan",src:"jual",id:j.id});
  for(const k of S.kas)out.push({t:k.tgl,jenis:k.jenis,jumlah:k.jumlah,ket:k.catatan||k.kategori,kat:k.kategori,src:"kas",id:k.id});
  for(const u of S.utang)if(u.jenis==="terima"){const p=S.pelanggan.find(x=>x.id===u.pelangganId);out.push({t:u.tgl,jenis:"masuk",jumlah:u.jumlah,ket:"Bayar utang · "+(p?p.nama:"Pelanggan"),kat:"Pelunasan utang",src:"utang",id:u.id})}
  for(const b of S.beli)if((b.dibayar||0)>0){const sp=S.supplier.find(x=>x.id===b.supplierId);out.push({t:b.tgl,jenis:"keluar",jumlah:b.dibayar,ket:"Stok masuk"+(sp?" · "+sp.nama:""),kat:"Belanja stok",src:"beli",id:b.id})}
  for(const h of S.hutsup)if(h.jenis==="bayar"){const sp=S.supplier.find(x=>x.id===h.supplierId);out.push({t:h.tgl,jenis:"keluar",jumlah:h.jumlah,ket:"Bayar supplier · "+(sp?sp.nama:"Supplier"),kat:"Bayar utang supplier",src:"hutsup",id:h.id})}
  return out.sort((a,b)=>b.t-a.t);
}
function saldoKas(){return kasEntries().reduce((a,e)=>a+(e.jenis==="masuk"?e.jumlah:-e.jumlah),0)}
function laporan(p){
  const r=range(p);let omzet=0,modal=0,trx=0,masukLain=0,keluar=0,lunas=0,belanjaStok=0,opname=0;const per={};const katK={};
  for(const j of S.jual)if(inR(j.tgl,r)){omzet+=j.total;modal+=j.modal||0;trx++;for(const it of j.items||[]){per[it.nama]=(per[it.nama]||0)+it.qty}}
  for(const k of S.kas)if(inR(k.tgl,r)){if(k.jenis==="masuk")masukLain+=k.jumlah;else if(k.kategori==="Belanja stok")belanjaStok+=k.jumlah;else{keluar+=k.jumlah;katK[k.kategori]=(katK[k.kategori]||0)+k.jumlah}}
  for(const b of S.beli)if(inR(b.tgl,r))belanjaStok+=b.total;
  for(const o of S.opname)if(inR(o.tgl,r))opname+=o.nilai||0;
  for(const u of S.utang)if(u.jenis==="terima"&&inR(u.tgl,r))lunas+=u.jumlah;
  const labaKotor=omzet-modal;
  return{omzet,modal,trx,masukLain,keluar,lunas,labaKotor,belanjaStok,opname,labaBersih:labaKotor+masukLain-keluar+opname,
    top:Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,5),katK:Object.entries(katK).sort((a,b)=>b[1]-a[1])};
}
const lowStok=()=>S.produk.filter(p=>(p.stok||0)<=(p.minStok!=null?p.minStok:S.toko.minStok||5)).sort((a,b)=>a.stok-b.stok);
const cartItems=()=>Object.entries(S.cart).map(([id,q])=>{const p=S.produk.find(x=>x.id===id);return p?{p,q}:null}).filter(Boolean);
const cartTotal=()=>cartItems().reduce((a,{p,q})=>a+p.harga*q,0);
const dueInfo=pid=>{const list=S.utang.filter(u=>u.pelangganId===pid&&u.jenis==="berikan"&&u.jatuhTempo);if(!list.length)return null;return Math.min(...list.map(u=>u.jatuhTempo))};

/* ---------- render ---------- */
const TABS=[["beranda","Beranda","home"],["kasir","Kasir","kasir"],["utang","Utang","utang"],["kas","Kas","kas"],["stok","Stok","stok"],["laporan","Laporan","lap"]];
const SUBT={beranda:"Ringkasan toko",kasir:"Kasir",utang:"Utang piutang",kas:"Buku kas",stok:"Stok barang",laporan:"Laporan"};
function greet(){const h=new Date().getHours();return h<11?"Selamat pagi":h<15?"Selamat siang":h<18?"Selamat sore":"Selamat malam"}
function hue(s){let h=0;for(const c of String(s||""))h=(h*31+c.charCodeAt(0))>>>0;return "c"+(h%6)}
function av(name){return '<div class="av '+hue(name)+'">'+esc(initials(name))+'</div>'}
function kpi(icon,tone,label,value,sub){return '<div class="kpi"><div class="kpi-ic t-'+tone+'">'+ico(icon)+'</div><div class="kpi-tx"><span>'+label+'</span><b class="num">'+value+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div></div>'}
function tile(icon,tone,label,sub,attrs){return '<button type="button" class="qt" '+attrs+'><div class="kpi-ic t-'+tone+'">'+ico(icon)+'</div><div><b>'+label+'</b><small>'+sub+'</small></div></button>'}
function emptyBox(icon,text){return '<div class="empty">'+ico(icon)+'<p>'+text+'</p></div>'}
function omzetDay(a){let s=0;for(const j of S.jual)if(j.tgl>=a&&j.tgl<a+DAY)s+=j.total;return s}
const shortRp=n=>n>=1e6?(n/1e6).toFixed(1).replace(".",",")+"jt":n>=1e3?Math.round(n/1e3)+"rb":String(n);
function chart7(){
  const t0=sod(Date.now());const days=[];for(let i=6;i>=0;i--){const a=t0-i*DAY;days.push({a,s:omzetDay(a)})}
  const mx=Math.max(1,...days.map(d=>d.s));
  const html='<div class="chart"><div class="gridl"><i></i><i></i><i></i><i></i><i></i></div><div class="bars">'+days.map((d,i)=>
    '<div class="bar'+(i===6?" today":"")+'" title="'+rp(d.s)+'"><div class="colb"><i style="height:'+Math.max(2,Math.round(d.s/mx*100))+'%">'+(d.s?'<em class="num">'+shortRp(d.s)+'</em>':'')+'</i></div><span>'+(i===6?"Hari ini":new Date(d.a).toLocaleDateString("id-ID",{weekday:"short"}))+'</span></div>').join("")+'</div></div>';
  return{html,total:days.reduce((x,d)=>x+d.s,0)};
}
function progList(entries,fmt,tone){
  if(!entries.length)return "";
  const mx=Math.max(1,...entries.map(e=>e[1]));
  return '<div class="prog">'+entries.map(([n,v],i)=>'<div class="prog-row"><div><span>'+(i+1)+'. '+esc(n)+'</span><b class="num">'+fmt(v)+'</b></div><span class="track"><i class="'+(tone||"")+'" style="width:'+Math.max(4,Math.round(v/mx*100))+'%"></i></span></div>').join("")+'</div>';
}

}

function vUtang(){
  const tp=totalPiutang();
  const rows=S.pelanggan.map(p=>({p,s:saldoPel(p.id),d:dueInfo(p.id)})).sort((a,b)=>b.s-a.s||a.p.nama.localeCompare(b.p.nama));
  const now=Date.now();const lewat=rows.filter(x=>x.s>0&&x.d&&x.d<sod(now)).length;
  let h='<div class="pagehead"><div><h2>Utang Piutang</h2><small>Catat utang pelanggan dan tagih lewat WhatsApp</small></div><div class="acts"><button class="btn sm" type="button" data-act="pelBaru">'+ico("plus")+'Pelanggan</button></div></div>'+
    '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'+kpi("wallet","amber","Total piutang",rp(tp),rows.filter(x=>x.s>0).length+" pelanggan berutang")+kpi("clock","rose","Lewat jatuh tempo",lewat+" pelanggan","Segera tagih")+kpi("users","blue","Jumlah pelanggan",String(S.pelanggan.length),"Terdaftar")+'</div>';
  if(!rows.length)return h+'<div class="panel">'+emptyBox("users","Belum ada pelanggan. Tambahkan pelanggan untuk mulai mencatat utang.")+'</div>';
  h+='<section class="panel"><div class="panel-head"><h3>Daftar pelanggan</h3></div><div class="list">'+rows.map(({p,s,d})=>{let tag="";if(s>0&&d){tag=d<sod(now)?'<span class="pill r">Lewat tempo</span>':'<span class="pill n">Tempo '+fmtD(d)+'</span>'}else if(s<=0)tag='<span class="pill g">Lunas</span>';
    return '<div class="row tap" data-act="pel" data-id="'+p.id+'">'+av(p.nama)+'<div class="main"><b>'+esc(p.nama)+'</b><small>'+(p.hp?esc(p.hp)+' ':'')+tag+'</small></div><div class="amt num '+(s>0?"warn":s<0?"pos":"")+'">'+rp(Math.abs(s))+(s<0?'<br><small style="font-weight:500">titip/lebih bayar</small>':'')+'</div></div>'}).join("")+'</div></section>';
  return h;
}

  const r=range(S.periode);const f=S.kasFilter;

   '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'+kpi("up","green","Pemasukan",rp(m))+kpi("down","rose","Pengeluaran",rp(k))+kpi("wallet","blue","Selisih",(m-k<0?"−":"")+rp(Math.abs(m-k)),"Saldo kas: "+rp(saldoKas()))+'</div>'+

function periodChips(){return '<div class="chips">'+[["hari","Hari ini"],["minggu","7 hari"],["bulan","Bulan ini"],["semua","Semua"]].map(([k,l])=>'<button class="chip" type="button" data-per="'+k+'" aria-pressed="'+(S.periode===k)+'">'+l+'</button>').join("")+'</div>'}
function vStok(){
  const own=!isKasir();const sv=own?S.stokView:"barang";
  const acts={barang:'<button class="btn sm ghost" type="button" data-act="beliBaru">'+ico("inbox")+'Stok masuk</button><button class="btn sm" type="button" data-act="addProduk">'+ico("plus")+'Barang baru</button>',
    beli:'<button class="btn sm" type="button" data-act="beliBaru">'+ico("inbox")+'Stok masuk</button>',supplier:'<button class="btn sm" type="button" data-act="supBaru">'+ico("plus")+'Supplier baru</button>',
    opname:'<button class="btn sm" type="button" data-act="opnameBaru">'+ico("clip")+'Mulai opname</button>'};
  let h='<div class="pagehead"><div><h2>Stok Barang</h2><small>'+(own?"Barang, stok masuk dari supplier, dan stok opname":"Daftar barang dan sisa stok")+'</small></div>'+(own?'<div class="acts">'+acts[sv]+'</div>':'')+'</div>';
  if(own)h+='<div class="chips seg">'+[["barang","Barang"],["beli","Stok masuk"],["supplier","Supplier"],["opname","Opname"]].map(([k,l])=>'<button class="chip" type="button" data-sv="'+k+'" aria-pressed="'+(sv===k)+'">'+l+'</button>').join("")+'</div>';
  if(sv==="beli")return h+vBeliList();
  if(sv==="supplier")return h+vSupplierList();
  if(sv==="opname")return h+vOpnameList();
  const list=filteredProduk();
  const nilai=S.produk.reduce((a,p)=>a+(p.modal||0)*Math.max(0,p.stok||0),0);
  const low=lowStok();
  h+='<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'+kpi("stok","violet","Jenis barang",String(S.produk.length),kategoriList().length?kategoriList().length+" kategori":"")+(own?kpi("wallet","teal","Nilai stok (modal)",rp(nilai)):"")+kpi("clock","rose","Menipis / habis",low.length+" barang")+'</div>'+searchBox();
  if(!list.length)return h+'<div class="panel">'+emptyBox("stok",S.produk.length?'Tidak ada barang yang cocok.':'Belum ada barang. Tekan “Barang baru” untuk menambah.')+'</div>';
  return h+'<section class="panel"><div class="list">'+list.map(p=>{const min=p.minStok!=null?p.minStok:S.toko.minStok||5;const st=p.stok<=0?'<span class="pill r">Habis</span>':p.stok<=min?'<span class="pill a">Menipis</span>':'<span class="pill g">Aman</span>';
    const info='<b>'+esc(p.nama)+'</b><small class="num">'+(own?'Jual '+rp(p.harga)+' · Modal '+rp(p.modal):'Harga '+rp(p.harga))+(p.kategori?' · '+esc(p.kategori):'')+(p.barcode?' · '+esc(p.barcode):'')+'</small> '+st;
    return '<div class="row">'+av(p.nama)+(own?'<div class="main tap" data-act="editProduk" data-id="'+p.id+'" style="cursor:pointer">'+info+'</div><div class="stepper"><button type="button" data-act="stok" data-d="-1" data-id="'+p.id+'" aria-label="Kurangi stok">−</button><b class="num" style="min-width:34px;text-align:center">'+p.stok+'</b><button type="button" data-act="stok" data-d="1" data-id="'+p.id+'" aria-label="Tambah stok">+</button></div>':'<div class="main">'+info+'</div><b class="num">'+p.stok+' '+esc(p.satuan||"pcs")+'</b>')+'</div>'}).join("")+'</div></section>';
}
function vLaporan(){
  const L=laporan(S.periode);const c=chart7();
  const lines=[["Penjualan",L.omzet,""],["Modal barang terjual",-L.modal,""],["Laba kotor",L.labaKotor,"b"],["Pemasukan lain",L.masukLain,""],["Pengeluaran operasional",-L.keluar,""]].concat(L.opname?[["Selisih stok opname",L.opname,""]]:[]).concat([["Laba bersih",L.labaBersih,"b"]]);

   '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">'+kpi("trend","blue","Penjualan",rp(L.omzet),margin)+kpi("wallet",L.labaBersih>=0?"green":"rose","Laba bersih",(L.labaBersih<0?"−":"")+rp(Math.abs(L.labaBersih)))+kpi("kasir","violet","Transaksi",String(L.trx),L.trx?"Rata-rata "+rp(L.omzet/L.trx):"")+kpi("users","amber","Utang dilunasi",rp(L.lunas))+'</div>'+
   '<div class="dash-grid"><div class="col"><section class="panel"><div class="panel-head"><div><h3>Penjualan 7 hari terakhir</h3><small>Total <b class="num">'+rp(c.total)+'</b></small></div></div><div class="panel-body">'+c.html+'</div></section>'+
   '<section class="panel"><div class="panel-head"><h3>Laba rugi</h3></div><div class="panel-body">'+lines.map(([l,v,b])=>'<div class="lr'+(b?" b":"")+'"><span>'+l+'</span><span class="num '+(b?(v>=0?"pos":"neg"):"")+'">'+rp(v)+'</span></div>').join("")+(L.belanjaStok?'<p class="muted" style="font-size:12.5px;margin:10px 0 0">Belanja stok '+rp(L.belanjaStok)+' tidak dihitung sebagai biaya, karena biaya barang sudah masuk lewat “Modal barang terjual” saat barang terjual.</p>':'')+'</div></section></div>'+

/* ---------- sheet ---------- */
function openSheet(title,body,onMount){
  $("#sheetRoot").innerHTML='<div class="scrim" data-act="closeScrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet-head"><h2>'+esc(title)+'</h2><button class="x" type="button" data-act="close" aria-label="Tutup">×</button></div>'+body+'</div></div>';
  const first=$("#sheetRoot input:not([type=hidden]),#sheetRoot select");if(first&&window.innerWidth>640)first.focus();
  if(onMount)onMount($("#sheetRoot .sheet"));
}
function closeSheet(){$("#sheetRoot").innerHTML=""}
function toast(m){$("#toastRoot").innerHTML='<div class="toast" role="status">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{$("#toastRoot").innerHTML=""},2400)}
function confirmBtn(btn,label,fn){if(btn.dataset.armed){fn();return}btn.dataset.armed="1";const old=btn.textContent;btn.textContent=label;setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3000)}
async function guard(btn,fn){if(btn)btn.disabled=true;try{await fn()}catch(e){console.error(e);toast(errMsg(e))}finally{if(btn&&btn.isConnected)btn.disabled=false}}

function sheetProduk(p){
  p=p||{};if(isKasir()){toast("Hanya pemilik yang bisa mengubah barang");return}
  openSheet(p.id?"Ubah barang":"Tambah barang",'<form class="stack" id="fProduk">'+
   '<label class="f">Nama barang<input id="pNama" required value="'+esc(p.nama||"")+'" placeholder="mis. Gula pasir 1 kg"></label>'+
   '<div class="grid2"><label class="f">Kategori<input id="pKat" list="katList" value="'+esc(p.kategori||"")+'" placeholder="mis. Sembako"><datalist id="katList">'+kategoriList().map(k=>'<option value="'+esc(k)+'">').join("")+'</datalist></label><label class="f">Barcode<span class="searchrow"><input id="pBar" inputmode="numeric" value="'+esc(p.barcode||"")+'" placeholder="Scan atau ketik" autocomplete="off">'+scanBtn("pScan")+'</span></label></div>'+
   '<div class="grid2"><label class="f">Harga jual (Rp)<input id="pHarga" inputmode="numeric" required value="'+(p.harga||"")+'"></label><label class="f">Harga modal (Rp)<input id="pModal" inputmode="numeric" value="'+(p.modal||"")+'"></label></div>'+
   '<div class="grid2"><label class="f">Stok<input id="pStok" inputmode="numeric" value="'+(p.stok!=null?p.stok:"")+'"></label><label class="f">Satuan<input id="pSatuan" value="'+esc(p.satuan||"pcs")+'"></label></div>'+
   '<label class="f">Ingatkan bila stok di bawah<input id="pMin" inputmode="numeric" value="'+(p.minStok!=null?p.minStok:S.toko.minStok||5)+'"></label>'+
   '<button class="btn" type="submit">'+(p.id?"Simpan perubahan":"Tambah barang")+'</button>'+(p.id?'<button class="btn ghost" type="button" id="pDel" style="color:var(--red)">Hapus barang</button>':'')+'</form>',sh=>{
    sh.querySelector("#fProduk").addEventListener("submit",ev=>{ev.preventDefault();const d={nama:$("#pNama").value.trim(),kategori:$("#pKat").value.trim(),barcode:$("#pBar").value.trim(),harga:num($("#pHarga").value),modal:num($("#pModal").value),stok:num($("#pStok").value),satuan:$("#pSatuan").value.trim()||"pcs",minStok:num($("#pMin").value)};
      if(!d.nama)return;if(d.barcode){const dup=S.produk.find(x=>x.barcode===d.barcode&&x.id!==p.id);if(dup){toast("Barcode ini sudah dipakai "+dup.nama);return}}guard(ev.submitter,async()=>{if(p.id)await updDoc("produk",p.id,d);else await addDoc("produk",d);closeSheet();toast(p.id?"Barang diperbarui":"Barang ditambahkan")})});
    const del=sh.querySelector("#pDel");if(del)del.addEventListener("click",()=>confirmBtn(del,"Ketuk lagi untuk menghapus",()=>guard(del,async()=>{await delDoc("produk",p.id);delete S.cart[p.id];closeSheet();toast("Barang dihapus")})));
    const pb=sh.querySelector("#pBar");if(pb)pb.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();const h=sh.querySelector("#pHarga");if(h)h.focus()}});
    const ps=sh.querySelector('[data-act="pScan"]');if(ps)ps.addEventListener("click",e=>{e.stopPropagation();scanCamera().then(c=>{if(c)sh.querySelector("#pBar").value=c})});
  });
}
function sheetKas(jenis,k){
  k=k||{};jenis=k.jenis||jenis;
  const kat=jenis==="masuk"?["Penjualan lain","Modal tambahan","Pinjaman","Lainnya"]:["Belanja stok","Listrik & air","Gaji karyawan","Sewa tempat","Transportasi","Pulsa & internet","Lainnya"];
  openSheet((k.id?"Ubah ":"Catat ")+(jenis==="masuk"?"pemasukan":"pengeluaran"),'<form class="stack" id="fKas">'+
   '<label class="f">Jumlah (Rp)<input id="kJml" inputmode="numeric" required value="'+(k.jumlah||"")+'" placeholder="0"></label>'+
   '<label class="f">Kategori<select id="kKat">'+kat.map(c=>'<option'+(k.kategori===c?" selected":"")+'>'+c+'</option>').join("")+'</select></label>'+
   '<label class="f">Catatan<input id="kCat" value="'+esc(k.catatan||"")+'" placeholder="mis. Bayar token listrik"></label>'+
   '<label class="f">Tanggal<input id="kTgl" type="date" value="'+toInputDate(k.tgl||Date.now())+'"></label>'+
   '<button class="btn '+(jenis==="masuk"?"":"red")+'" type="submit">Simpan</button>'+(k.id?'<button class="btn ghost" type="button" id="kDel" style="color:var(--red)">Hapus catatan</button>':'')+'</form>',sh=>{
    sh.querySelector("#fKas").addEventListener("submit",ev=>{ev.preventDefault();const jml=num($("#kJml").value);if(jml<=0)return;
      const dv=$("#kTgl").value;let t=Date.now();if(dv){const[y,m,d]=dv.split("-").map(Number);const n=new Date();const x=new Date(y,m-1,d,n.getHours(),n.getMinutes());t=x.getTime()}
      const d={jenis,jumlah:jml,kategori:$("#kKat").value,catatan:$("#kCat").value.trim(),tgl:k.id&&toInputDate(k.tgl)===dv?k.tgl:t};
      guard(ev.submitter,async()=>{if(k.id)await updDoc("kas",k.id,d);else await addDoc("kas",d);closeSheet();toast("Tersimpan")})});
    const del=sh.querySelector("#kDel");if(del)del.addEventListener("click",()=>confirmBtn(del,"Ketuk lagi untuk menghapus",()=>guard(del,async()=>{await delDoc("kas",k.id);closeSheet();toast("Catatan dihapus")})));
  });
}
function sheetPelBaru(after){
  openSheet("Pelanggan baru",'<form class="stack" id="fPel"><label class="f">Nama pelanggan<input id="cNama" required placeholder="mis. Bu Sari"></label><label class="f">Nomor WhatsApp<input id="cHp" inputmode="tel" placeholder="08xxxxxxxxxx"></label><button class="btn" type="submit">Simpan pelanggan</button></form>',sh=>{
    sh.querySelector("#fPel").addEventListener("submit",ev=>{ev.preventDefault();const d={nama:$("#cNama").value.trim(),hp:$("#cHp").value.trim()};if(!d.nama)return;

function sheetUtangEntry(pid,jenis){
  const p=S.pelanggan.find(x=>x.id===pid);if(!p)return;
  const isB=jenis==="berikan";
  openSheet(isB?"Berikan utang · "+p.nama:"Terima bayaran · "+p.nama,'<form class="stack" id="fUt">'+
   '<p style="margin:0;color:var(--muted);font-size:13px">'+(isB?"Catat barang atau uang yang dibawa pelanggan dan belum dibayar.":"Catat uang yang dibayarkan pelanggan untuk melunasi utangnya. Uang ini masuk ke kas.")+' Sisa utang sekarang <b class="num">'+rp(Math.max(0,saldoPel(pid)))+'</b>.</p>'+
   '<label class="f">Jumlah (Rp)<input id="uJml" inputmode="numeric" required placeholder="0"></label>'+
   '<label class="f">Catatan<input id="uCat" placeholder="'+(isB?"mis. Beras 5 kg + minyak":"mis. Cicilan pertama")+'"></label>'+
   (isB?'<label class="f">Jatuh tempo (opsional)<input id="uDue" type="date"></label>':'<button class="btn ghost sm" type="button" id="uLunas">Isi sisa utang ('+rp(Math.max(0,saldoPel(pid)))+')</button>')+

    const l=sh.querySelector("#uLunas");if(l)l.addEventListener("click",()=>{$("#uJml").value=Math.max(0,saldoPel(pid))});

function waText(p,s){return "Halo "+p.nama+", ini pengingat dari "+(S.toko.nama||"toko kami")+". Sisa utang Anda saat ini "+rp(s)+". Mohon dilunasi bila sempat. Terima kasih 🙏"}

   '<div class="sec"><span class="label">Riwayat</span>'+(hist.length?'<div class="list">'+hist.map(u=>'<div class="row"><div class="main"><b>'+(u.jenis==="berikan"?"Berutang":"Membayar")+(u.catatan?" · "+esc(u.catatan):"")+'</b><small>'+fmtDT(u.tgl)+(u.jatuhTempo?' · tempo '+fmtD(u.jatuhTempo):'')+'</small></div><div class="amt num '+(u.jenis==="berikan"?"warn":"pos")+'">'+(u.jenis==="berikan"?"+":"−")+rp(u.jumlah)+'</div><button class="x" type="button" data-act="delUt" data-id="'+u.id+'" data-pid="'+pid+'" aria-label="Hapus catatan" style="font-size:13px">✕</button></div>').join("")+'</div>':'<div class="empty">Belum ada catatan utang.</div>')+'</div>'+

function notaText(j,cash,pel){
  const p=pel?S.pelanggan.find(x=>x.id===pel):null;
  let t=(S.toko.nama||"Toko")+"\n"+fmtDT(j.tgl)+"\n------------------------\n";
  for(const x of j.items)t+=x.nama+"\n  "+x.qty+" x "+rp(x.harga)+" = "+rp(x.qty*x.harga)+"\n";
  t+="------------------------\nTOTAL "+rp(j.total)+"\n";
  if(j.metode==="tunai"&&cash!=null){t+="Tunai "+rp(cash)+"\nKembali "+rp(cash-j.total)+"\n"}
  else if(j.metode==="transfer")t+="Dibayar via transfer/QRIS\n";
  else if(p)t+="Dicatat sebagai utang a.n. "+p.nama+"\n";
  return t+"\nTerima kasih sudah berbelanja!";
}

/* ---------- kategori & barcode ---------- */
function kategoriList(){return [...new Set(S.produk.map(p=>(p.kategori||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function katChips(){const k=kategoriList();if(!k.length)return "";if(S.kat&&!k.includes(S.kat))S.kat="";
  return '<div class="chips">'+[["","Semua"]].concat(k.map(x=>[x,x])).map(([v,l])=>'<button class="chip" type="button" data-kat="'+esc(v)+'" aria-pressed="'+(S.kat===v)+'">'+esc(l)+'</button>').join("")+'</div>'}
function filteredProduk(){const q=S.q.trim().toLowerCase();return S.produk.filter(p=>(!S.kat||(p.kategori||"")===S.kat)&&(!q||p.nama.toLowerCase().includes(q)||(p.barcode&&String(p.barcode).includes(q)))).sort((a,b)=>a.nama.localeCompare(b.nama))}
function findBarcode(code){code=String(code||"").trim();return code?S.produk.find(p=>p.barcode&&String(p.barcode)===code):null}
function addToCart(p){S.cart[p.id]=(S.cart[p.id]||0)+1;if(S.cart[p.id]>p.stok)toast("Stok "+p.nama+" tinggal "+p.stok);else toast("+1 "+p.nama)}
function focusSearch(){if(window.innerWidth<960)return;const i=$("#qProduk");if(i)i.focus()}
function handleCode(code){
  code=String(code||"").trim();if(!code)return;const p=findBarcode(code);
  if(S.tab==="kasir"){
    if(p){addToCart(p);S.q="";render();focusSearch();return}
    const list=filteredProduk();if(S.q&&list.length===1){addToCart(list[0]);S.q="";render();focusSearch();return}
    if(/^\d{5,}$/.test(code)){if(isKasir())toast("Barcode "+code+" belum terdaftar");else{toast("Barcode belum terdaftar. Tambahkan barangnya.");sheetProduk({barcode:code})}}
    return;
  }
  if(S.tab==="stok"&&!isKasir()){if(p)sheetProduk(p);else if(/^\d{5,}$/.test(code))sheetProduk({barcode:code})}
}
async function scanCamera(){
  const BS=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BarcodeScanner;
  if(!BS){toast("Scan kamera tersedia di aplikasi Android. Di laptop, pakai scanner barcode USB.");return null}
  try{
    const a=await BS.isGoogleBarcodeScannerModuleAvailable();
    if(!a||!a.available){toast("Menyiapkan pemindai barcode (sekali saja, perlu internet). Coba lagi 1 menit lagi.");try{await BS.installGoogleBarcodeScannerModule()}catch(_){}return null}
    const r=await BS.scan();const c=r&&r.barcodes&&r.barcodes[0];return c?(c.rawValue||c.displayValue||null):null;
  }catch(e){const m=String((e&&e.message)||e||"");if(!/cancel/i.test(m))toast("Gagal memindai: "+m);return null}
}
function scanBtn(act,extra){return isNative()?'<button class="btn ghost scanbtn" type="button" data-act="'+act+'"'+(extra||"")+' aria-label="Scan barcode dengan kamera">'+ico("scan")+'</button>':""}
const SCAN={buf:"",t:0};
document.addEventListener("keydown",e=>{
  const tg=e.target;if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))return;if($("#sheetRoot").innerHTML)return;
  if(e.ctrlKey||e.altKey||e.metaKey)return;
  const now=Date.now();if(now-SCAN.t>80)SCAN.buf="";SCAN.t=now;
  if(e.key==="Enter"){if(SCAN.buf.length>=4){e.preventDefault();const c=SCAN.buf;SCAN.buf="";handleCode(c)}return}
  if(e.key.length===1)SCAN.buf+=e.key;
});

/* ---------- supplier & stok masuk ---------- */
function saldoSup(id){let s=0;for(const h of S.hutsup)if(h.supplierId===id)s+=h.jenis==="beli"?h.jumlah:-h.jumlah;return s}
function totalHutSup(){return S.supplier.reduce((a,s)=>a+Math.max(0,saldoSup(s.id)),0)}
function supName(id){const s=S.supplier.find(x=>x.id===id);return s?s.nama:(id?"Supplier terhapus":"Tanpa supplier")}

  const rb=range("bulan");const bulan=S.beli.filter(b=>inR(b.tgl,rb)).reduce((a,b)=>a+b.total,0);

function vSupplierList(){

function sheetBeli(){
  if(!S.produk.length){toast("Tambahkan barang dulu di menu Stok");return}
  const st={items:[],edited:false};
  const tot=()=>st.items.reduce((a,x)=>a+x.qty*x.harga,0);
  openSheet("Stok masuk",
   '<div class="grid2"><label class="f">Supplier<select id="bSup"><option value="">— Tanpa supplier —</option>'+S.supplier.slice().sort((a,b)=>a.nama.localeCompare(b.nama)).map(s=>'<option value="'+s.id+'">'+esc(s.nama)+'</option>').join("")+'<option value="__new">+ Supplier baru…</option></select></label><label class="f">Tanggal<input id="bTgl" type="date" value="'+toInputDate(Date.now())+'"></label></div>'+
   '<label class="f" id="bSupNewW" hidden>Nama supplier baru<input id="bSupNew" placeholder="mis. CV Sumber Pangan"></label>'+
   '<div class="sec"><span class="label">Tambah barang</span><div class="searchrow"><div class="search">'+ico("search")+'<input id="bQ" placeholder="Cari nama atau scan barcode, lalu Enter" autocomplete="off"></div>'+scanBtn("bScan")+'</div><div id="bRes"></div></div>'+
   '<div id="bItems"></div>'+
   '<div class="cart-total" style="padding:6px 0;border:0"><span>Total pembelian</span><b class="num" id="bTot">Rp0</b></div>'+
   '<div class="grid2"><label class="f">Dibayar sekarang (Rp)<input id="bBayar" inputmode="numeric" value="0"></label><label class="f" id="bDueW">Jatuh tempo utang<input id="bDue" type="date"></label></div><small class="muted" id="bSisa"></small>'+
   '<label class="f" style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input type="checkbox" id="bModal" checked style="width:20px;height:20px"> Perbarui harga modal barang (rata-rata)</label>'+
   '<label class="f">Catatan<input id="bCat" placeholder="mis. No. faktur 1234"></label>'+
   '<button class="btn" type="button" id="bSave">Simpan stok masuk</button>',sh=>{
    const q=sh.querySelector("#bQ"),res=sh.querySelector("#bRes"),box=sh.querySelector("#bItems");
    const draw=()=>{
      box.innerHTML=st.items.length?'<div class="list">'+st.items.map((x,i)=>'<div class="row ed"><div class="main"><b>'+esc(x.nama)+'</b><small class="num">Stok sekarang '+x.stok+' · subtotal <b data-sub="'+i+'">'+rp(x.qty*x.harga)+'</b></small></div><label class="mini">Jumlah<input data-q="'+i+'" inputmode="numeric" value="'+x.qty+'"></label><label class="mini">Harga beli<input data-h="'+i+'" inputmode="numeric" value="'+x.harga+'"></label><button class="x" type="button" data-rm="'+i+'" aria-label="Hapus">×</button></div>').join("")+'</div>':'<div class="empty" style="padding:14px">Belum ada barang. Cari atau scan barang di atas.</div>';
      sums();
    };
    const sums=()=>{const t=tot();sh.querySelector("#bTot").textContent=rp(t);const by=sh.querySelector("#bBayar");if(!st.edited)by.value=t;const sisa=t-Math.min(t,num(by.value));
      sh.querySelector("#bSisa").textContent=sisa>0?"Sisa "+rp(sisa)+" dicatat sebagai utang ke supplier.":"Pembelian lunas.";sh.querySelector("#bDueW").style.visibility=sisa>0?"visible":"hidden"};
    const add=p=>{const ex=st.items.find(x=>x.pid===p.id);if(ex)ex.qty+=1;else st.items.push({pid:p.id,nama:p.nama,qty:1,harga:p.modal||0,stok:p.stok||0});q.value="";res.innerHTML="";draw();q.focus()};
    const search=()=>{const v=q.value.trim().toLowerCase();if(!v){res.innerHTML="";return}
      const m=S.produk.filter(p=>p.nama.toLowerCase().includes(v)||(p.barcode&&String(p.barcode).includes(v))).slice(0,6);
      res.innerHTML=m.length?'<div class="list">'+m.map(p=>'<div class="row tap" data-add="'+p.id+'">'+av(p.nama)+'<div class="main"><b>'+esc(p.nama)+'</b><small class="num">Stok '+p.stok+' · modal '+rp(p.modal)+'</small></div>'+ico("plus")+'</div>').join("")+'</div>':'<small class="muted">Barang tidak ditemukan. Tambahkan dulu di menu Stok → Barang baru.</small>'};
    q.addEventListener("input",search);
    q.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();const v=q.value.trim();const p=findBarcode(v);if(p)return add(p);const m=S.produk.filter(x=>x.nama.toLowerCase().includes(v.toLowerCase()));if(m.length===1)add(m[0]);else if(!m.length)toast("Barang tidak ditemukan")});
    sh.addEventListener("click",e=>{const a=e.target.closest("[data-add]");if(a){const p=S.produk.find(x=>x.id===a.dataset.add);if(p)add(p);return}
      const r=e.target.closest("[data-rm]");if(r){st.items.splice(Number(r.dataset.rm),1);draw();return}
      if(e.target.closest('[data-act="bScan"]')){e.stopPropagation();scanCamera().then(c=>{if(!c)return;const p=findBarcode(c);if(p)add(p);else toast("Barcode "+c+" belum terdaftar")})}});
    sh.addEventListener("input",e=>{const t=e.target;if(t.dataset.q!=null){st.items[t.dataset.q].qty=Math.max(0,num(t.value));}else if(t.dataset.h!=null){st.items[t.dataset.h].harga=Math.max(0,num(t.value))}else if(t.id==="bBayar"){st.edited=true}else return;
      const i=t.dataset.q!=null?t.dataset.q:t.dataset.h;if(i!=null){const el=sh.querySelector('[data-sub="'+i+'"]');if(el)el.textContent=rp(st.items[i].qty*st.items[i].harga)}sums()});
    sh.querySelector("#bSup").addEventListener("change",e=>{sh.querySelector("#bSupNewW").hidden=e.target.value!=="__new"});
    draw();
    sh.querySelector("#bSave").addEventListener("click",ev=>{
      const items=st.items.filter(x=>x.qty>0);if(!items.length){toast("Tambahkan minimal satu barang");return}
      const t=items.reduce((a,x)=>a+x.qty*x.harga,0);const bayar=Math.min(t,Math.max(0,num(sh.querySelector("#bBayar").value)));
      let supId=sh.querySelector("#bSup").value;const newName=(sh.querySelector("#bSupNew").value||"").trim();
      if(supId==="__new"&&!newName){toast("Isi nama supplier baru");return}

      const dv=sh.querySelector("#bTgl").value;let tgl=Date.now();if(dv&&dv!==toInputDate(Date.now())){const[y,m,d]=dv.split("-").map(Number);tgl=new Date(y,m-1,d,12,0).getTime()}
      const updModal=sh.querySelector("#bModal").checked;const due=sh.querySelector("#bDue").value;const cat=sh.querySelector("#bCat").value.trim();

        for(const x of items){const p=S.produk.find(y=>y.id===x.pid);if(!p)continue;const old=Math.max(0,p.stok||0);const upd={stok:(p.stok||0)+x.qty};
          if(updModal&&x.harga>0)upd.modal=Math.round((old*(p.modal||0)+x.qty*x.harga)/(old+x.qty));await updDoc("produk",p.id,upd)}
        if(t>bayar){const h={supplierId:supId,jenis:"beli",jumlah:t-bayar,tgl,beliId:bid,catatan:cat||"Pembelian"};if(due){const[y,m,d]=due.split("-").map(Number);h.jatuhTempo=new Date(y,m-1,d,23,59).getTime()}await addDoc("hutsup",h)}
        S.stokView="beli";closeSheet();render();toast("Stok masuk tersimpan, stok barang bertambah");
      });
    });
  });
}

function sheetOpname(){
  if(!S.produk.length){toast("Belum ada barang");return}
  const st={fisik:{},q:""};
  openSheet("Stok opname",'<p class="muted" style="margin:0">Isi jumlah fisik barang yang Anda hitung. Barang yang dikosongkan tidak diubah. Setelah disimpan, stok di aplikasi disamakan dengan hitungan fisik.</p>'+
   '<div class="searchrow"><div class="search">'+ico("search")+'<input id="oQ" placeholder="Cari nama atau scan barcode" autocomplete="off"></div>'+scanBtn("oScan")+'</div><div id="oList"></div>'+
   '<div class="stat" id="oSum"></div><label class="f">Catatan<input id="oCat" placeholder="mis. Opname akhir bulan"></label><button class="btn" type="button" id="oSave">Simpan hasil opname</button>',sh=>{
    const listEl=sh.querySelector("#oList");
    const sum=()=>{let n=0,nilai=0,beda=0;for(const [pid,v] of Object.entries(st.fisik)){if(v===""||v==null)continue;const p=S.produk.find(x=>x.id===pid);if(!p)continue;n++;const s=Number(v)-(p.stok||0);if(s)beda++;nilai+=s*(p.modal||0)}
      sh.querySelector("#oSum").innerHTML='<span class="label">Ringkasan</span><b class="num" style="font-size:16px">'+n+' barang dihitung · '+beda+' berbeda</b><small class="num '+(nilai<0?"neg":nilai>0?"pos":"muted")+'">Nilai selisih '+(nilai?rp(nilai):"Rp0")+' (harga modal)</small>'};
    const draw=()=>{const v=st.q.trim().toLowerCase();const items=S.produk.filter(p=>!v||p.nama.toLowerCase().includes(v)||(p.barcode&&String(p.barcode).includes(v))).sort((a,b)=>a.nama.localeCompare(b.nama));
      listEl.innerHTML='<div class="list opn">'+items.map(p=>{const f=st.fisik[p.id];const has=f!==undefined&&f!=="";const s=has?Number(f)-(p.stok||0):0;
        return '<div class="row"><div class="main"><b>'+esc(p.nama)+'</b><small class="num">Di aplikasi: '+p.stok+' '+esc(p.satuan||"pcs")+' · <span data-sel="'+p.id+'" class="'+(s<0?"neg":s>0?"pos":"")+'">'+(has?(s===0?"cocok":(s>0?"+":"")+s):"")+'</span></small></div><label class="mini">Fisik<input data-f="'+p.id+'" inputmode="numeric" value="'+(has?f:"")+'" placeholder="'+p.stok+'"></label></div>'}).join("")+'</div>'+(items.length?'':'<small class="muted">Tidak ada barang yang cocok.</small>');sum()};
    sh.querySelector("#oQ").addEventListener("input",e=>{st.q=e.target.value;draw()});
    const jump=code=>{const p=findBarcode(code);if(!p){toast("Barcode "+code+" belum terdaftar");return}st.q="";sh.querySelector("#oQ").value="";st.fisik[p.id]=String((Number(st.fisik[p.id])||0)+1);draw();const i=sh.querySelector('[data-f="'+p.id+'"]');if(i){i.scrollIntoView({block:"center"});i.focus();i.select()}toast(p.nama+": "+st.fisik[p.id])};
    sh.querySelector("#oQ").addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();const v=e.target.value.trim();if(findBarcode(v))jump(v)});
    sh.addEventListener("click",e=>{if(e.target.closest('[data-act="oScan"]')){e.stopPropagation();scanCamera().then(c=>{if(c)jump(c)})}});
    sh.addEventListener("input",e=>{const pid=e.target.dataset.f;if(!pid)return;const raw=e.target.value.replace(/[^\d]/g,"");st.fisik[pid]=raw;const p=S.produk.find(x=>x.id===pid);const el=sh.querySelector('[data-sel="'+pid+'"]');
      if(el&&p){if(raw===""){el.textContent="";el.className=""}else{const s=Number(raw)-(p.stok||0);el.textContent=s===0?"cocok":(s>0?"+":"")+s;el.className=s<0?"neg":s>0?"pos":""}}sum()});
    draw();
    sh.querySelector("#oSave").addEventListener("click",ev=>{
      const items=[];for(const [pid,v] of Object.entries(st.fisik)){if(v===""||v==null)continue;const p=S.produk.find(x=>x.id===pid);if(!p)continue;const fis=Number(v);items.push({pid,nama:p.nama,sistem:p.stok||0,fisik:fis,selisih:fis-(p.stok||0),modal:p.modal||0})}
      if(!items.length){toast("Isi jumlah fisik minimal satu barang");return}
      const nilai=items.reduce((a,x)=>a+x.selisih*x.modal,0);

        for(const x of items)if(x.selisih)await updDoc("produk",x.pid,{stok:x.fisik});
        S.stokView="opname";closeSheet();render();toast("Opname tersimpan, stok sudah disesuaikan")});
    });
  });
}

/* ---------- cadangan otomatis ---------- */
const LAST_AUTO="catattoko.lastAuto",LAST_SHARE="catattoko.lastShare";
function lsNum(k){try{return Number(localStorage.getItem(k))||0}catch(_){return 0}}
function lsSetNum(k,v){try{localStorage.setItem(k,String(v))}catch(_){}}
function backupJson(){const out={aplikasi:"catat-toko",versi:2,dibuat:new Date().toISOString(),toko:S.toko};for(const c of COLS)out[c]=S[c];return JSON.stringify(out)}
function hasData(){return DATA_COLS.some(c=>S[c].length)}
async function autoBackup(force){
  if(!hasData())return;if(!force&&Date.now()-lsNum(LAST_AUTO)<20*3600000)return;
  const name="cadangan-otomatis-"+toInputDate(Date.now())+".json";const json=backupJson();
  try{
    if(window.catatDesktop&&window.catatDesktop.autoBackup){const r=await window.catatDesktop.autoBackup({name,json});if(r&&r.ok){lsSetNum(LAST_AUTO,Date.now());return true}return false}
    if(isNative()&&window.Capacitor.Plugins.Filesystem){const FS=window.Capacitor.Plugins.Filesystem;
      const write=()=>FS.writeFile({path:"CatatToko/"+name,data:json,directory:"DOCUMENTS",encoding:"utf8",recursive:true});
      try{await write()}catch(e){if(FS.requestPermissions){try{await FS.requestPermissions()}catch(_){}}await write()}
      lsSetNum(LAST_AUTO,Date.now());
      try{const r=await FS.readdir({path:"CatatToko",directory:"DOCUMENTS"});const files=(r.files||[]).map(f=>typeof f==="string"?f:f.name).filter(n=>/^cadangan-otomatis-.*\.json$/.test(n)).sort();
        for(const f of files.slice(0,Math.max(0,files.length-30)))await FS.deleteFile({path:"CatatToko/"+f,directory:"DOCUMENTS"})}catch(_){}
      return true}
  }catch(e){console.error("autoBackup",e)}
  return false;
}
function backupInfo(){
  const last=lsNum(LAST_AUTO);const plat=platformName();
  if(plat==="web")return '<small class="muted">Cadangan otomatis berjalan di aplikasi Windows dan Android.</small>';
  const where=plat==="windows"?"folder Documents\\CatatToko\\Cadangan":"folder Documents/CatatToko di memori HP";
  return '<div class="stat"><span class="label">Cadangan otomatis harian</span><b style="font-size:14.5px">'+(last?"Terakhir "+fmtDT(last):"Belum ada")+'</b><small class="muted">Disimpan di '+where+' (30 hari terakhir).'+(plat==="android"?" Kirim juga ke Google Drive atau WA seminggu sekali, supaya data aman jika HP hilang atau rusak.":" Salin folder itu ke flashdisk atau Google Drive secara rutin.")+'</small></div>'+
   (plat==="windows"?'<button class="btn ghost sm" type="button" data-act="openBackupDir">Buka folder cadangan</button>':'');
}
function backupBanner(){
  if(!hasData()||isKasir())return "";
  const plat=platformName();if(plat==="windows")return "";
  const last=lsNum(LAST_SHARE);if(Date.now()-last<7*DAY)return "";
  return '<div class="banner row-banner"><span>Data toko hanya ada di perangkat ini. '+(last?"Cadangan terakhir dikirim "+fmtD(last)+".":"Belum pernah dikirim ke tempat lain.")+' Kirim cadangan ke Google Drive atau WhatsApp supaya aman.</span><button class="btn sm" type="button" data-act="backup">Kirim cadangan</button></div>';
}

/* --- isi dokumen sebagai baris teks (dipakai struk & ESC/POS) --- */
function asciiOnly(s){return String(s==null?"":s).replace(/[−–—]/g,"-").replace(/[×]/g,"x").replace(/[·•]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\x20-\x7E]/g,"")}
function wrapTxt(s,n){s=String(s);const out=[];while(s.length>n){let i=s.lastIndexOf(" ",n);if(i<=0)i=n;out.push(s.slice(0,i));s=s.slice(i).replace(/^ /,"")}out.push(s);return out}
function lr(l,r,n){l=String(l);r=String(r);if(l.length+r.length+1>n)l=l.slice(0,Math.max(0,n-r.length-1));return l+" ".repeat(Math.max(1,n-l.length-r.length))+r}
function headLines(n){
  const L=wrapTxt(asciiOnly(S.toko.nama||"Toko"),Math.floor(n/2)).map(t=>({t,a:"c",b:1,big:1}));
  if(S.toko.alamat)wrapTxt(S.toko.alamat,n).forEach(x=>L.push({t:x,a:"c"}));
  if(S.toko.telp)L.push({t:"Telp/WA "+S.toko.telp,a:"c"});
  return L;
}
function docLines(kind,d,n){
  const sep={t:"-".repeat(n)};const L=headLines(n);L.push(sep);
  if(kind==="nota"){
    const j=d.j;const p=j.pelangganId?S.pelanggan.find(x=>x.id===j.pelangganId):null;
    L.push({t:lr("No",notaNo(j),n)},{t:lr("Tanggal",fmtFull(j.tgl),n)});
    if(p)L.push({t:lr("Pelanggan",p.nama,n)});if(j.kasir)L.push({t:lr("Kasir",j.kasir,n)});
    L.push(sep);
    for(const x of j.items){wrapTxt(x.nama,n).forEach(t=>L.push({t}));L.push({t:lr("  "+x.qty+" x "+angka(x.harga),angka(x.qty*x.harga),n)})}
    L.push(sep);
    L.push({t:lr("TOTAL",rpP(j.total),n),b:1});
    if(j.metode==="tunai"&&d.cash!=null){L.push({t:lr("Tunai",rpP(d.cash),n)},{t:lr("Kembali",rpP(d.cash-j.total),n)})}
    else if(j.metode==="transfer")L.push({t:lr("Bayar","Transfer/QRIS",n)});
    else if(j.metode==="utang")L.push({t:lr("Bayar","Utang (belum lunas)",n)});
    L.push(sep);
    wrapTxt(S.toko.footer||"Terima kasih sudah berbelanja!",n).forEach(t=>L.push({t,a:"c"}));
  }else if(kind==="utang"){
    const p=d.p;const hist=S.utang.filter(u=>u.pelangganId===p.id).sort((a,b)=>a.tgl-b.tgl);
    L.push({t:"RINCIAN UTANG",a:"c",b:1},{t:lr("Pelanggan",p.nama,n)},{t:lr("Dicetak",fmtFull(Date.now()),n)},sep);
    for(const u of hist){L.push({t:lr(new Date(u.tgl).toLocaleDateString("id-ID"),(u.jenis==="berikan"?"+":"-")+angka(u.jumlah),n)});if(u.catatan)wrapTxt("  "+u.catatan,n).slice(0,2).forEach(t=>L.push({t}))}
    L.push(sep,{t:lr("SISA UTANG",rpP(Math.max(0,saldoPel(p.id))),n),b:1});
  }else if(kind==="laporan"){
    const R=laporan(d.periode);
    L.push.apply(L,[{t:"LAPORAN KEUANGAN",a:"c",b:1},{t:periodeLabel(d.periode),a:"c"},{t:"Dicetak "+fmtFull(Date.now()),a:"c"},sep,
      {t:lr("Penjualan",rpP(R.omzet),n)},{t:lr("Modal terjual",rpP(-R.modal),n)},{t:lr("Laba kotor",rpP(R.labaKotor),n),b:1},
      {t:lr("Pemasukan lain",rpP(R.masukLain),n)},{t:lr("Pengeluaran",rpP(-R.keluar),n)}].concat(R.opname?[{t:lr("Selisih opname",rpP(R.opname),n)}]:[]).concat([sep,{t:lr("LABA BERSIH",rpP(R.labaBersih),n),b:1},sep,
      {t:lr("Jumlah transaksi",String(R.trx),n)},{t:lr("Utang dilunasi",rpP(R.lunas),n)}]));
    if(R.top.length){L.push(sep,{t:"Barang terlaris",b:1});R.top.forEach(([nm,q],i)=>L.push({t:lr((i+1)+". "+nm,String(q),n)}))}
  }else if(kind==="tes"){
    L.push({t:"TES PRINTER",a:"c",b:1},{t:lr("Kertas",PAPERS[d.paper].label,n)},{t:lr("Waktu",fmtFull(Date.now()),n)},{t:"1234567890".repeat(Math.ceil(n/10)).slice(0,n)},{t:"Printer siap dipakai.",a:"c"});
  }
  return L.map(x=>Object.assign({},x,{t:asciiOnly(x.t)}));
}

/* --- ESC/POS untuk printer thermal / TM-U220 --- */
function escposBytes(lines,cut){
  const out=[0x1B,0x40];
  const push=s=>{for(let i=0;i<s.length;i++)out.push(s.charCodeAt(i)&0x7F)};
  for(const l of lines){
    out.push(0x1B,0x61,l.a==="c"?1:l.a==="r"?2:0);
    out.push(0x1B,0x45,l.b?1:0);
    out.push(0x1D,0x21,l.big?0x11:0x00);
    push(l.t);out.push(0x0A);
  }
  out.push(0x1B,0x61,0,0x1B,0x45,0,0x1D,0x21,0,0x1B,0x64,4);
  if(cut)out.push(0x1D,0x56,0x42,0x00);
  return new Uint8Array(out);
}
function b64(bytes){let s="";for(let i=0;i<bytes.length;i++)s+=String.fromCharCode(bytes[i]);return btoa(s)}

/* --- kirim ke printer --- */
async function printDoc(kind,d){
  const c=printerCfg();const paper=PAPERS[c.paper]||PAPERS["58"];const plat=platformName();
  if(plat==="android"&&paper.roll&&!c.btAddress){toast("Pilih printer Bluetooth dulu");sheetPrinter(()=>printDoc(kind,d));return}
  try{
    if(plat==="android"){
      const CP=window.Capacitor.Plugins.CatatPrint;
      if(!CP){toast("Fitur cetak belum tersedia di versi ini. Install versi terbaru.");return}
      if(paper.roll){toast("Mengirim ke "+c.btName+"…");await CP.printBluetooth({address:c.btAddress,data:b64(escposBytes(docLines(kind,d,paper.cols),true))});toast("Tercetak di "+c.btName)}
      else await CP.printHtml({html:pageHtml(kind,d,paper),name:"Catat Toko - "+kind,size:c.paper});
    }else{
      const html=paper.roll?rollHtml(kind,d,paper):pageHtml(kind,d,paper);
      if(plat==="windows"){
        const r=await window.catatDesktop.print({html,deviceName:c.win||"",silent:!!c.win,paper:{kind:paper.roll?"roll":"page",widthMm:paper.w,heightMm:paper.h||0}});
        if(r&&r.ok)toast("Dikirim ke printer");else if(r&&r.reason&&!/cancel/i.test(r.reason))toast("Gagal mencetak: "+r.reason);
      }else{
        const f=document.createElement("iframe");f.style.cssText="position:fixed;width:0;height:0;border:0;right:0;bottom:0";document.body.appendChild(f);
        f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(_){}setTimeout(()=>f.remove(),60000)};f.srcdoc=html;
      }
    }
  }catch(e){toast((e&&e.message)||"Gagal mencetak")}
}

    if(plat==="windows")h+='<div class="sec"><span class="label">Printer</span><select id="pWin"><option value="">Pilih setiap kali mencetak (tampilkan dialog)</option></select><small class="muted">Printer kasir, dot matrix, dan printer Bluetooth harus sudah terpasang di Windows (driver terinstal). Jika printer dipilih, nota langsung tercetak tanpa dialog.</small></div>';
    if(plat==="android"){
      if(paper.roll)h+='<div class="sec"><span class="label">Printer Bluetooth</span><div class="stat"><b style="font-size:15px">'+(c.btName?esc(c.btName):"Belum dipilih")+'</b>'+(c.btAddress?'<small class="muted num">'+esc(c.btAddress)+'</small>':'')+'</div><div id="btList"></div><button class="btn ghost" type="button" id="btScan">Cari printer yang sudah dipasangkan</button><small class="muted">Nyalakan printer, lalu pasangkan (pair) dulu di Setelan → Bluetooth HP. PIN biasanya 0000 atau 1234.</small></div>';
      else h+='<div class="sec"><span class="label">Printer</span><small class="muted">A4 dan continuous dicetak lewat layanan cetak Android (printer WiFi, Mopria, atau aplikasi printer merek Anda). Anda juga bisa memilih "Simpan sebagai PDF".</small></div>';
    }
    if(plat==="web")h+='<small class="muted">Di browser, dokumen dicetak lewat dialog cetak browser.</small>';
    h+='<label class="f" style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input type="checkbox" id="pAuto" style="width:20px;height:20px"'+(c.auto?" checked":"")+'> Cetak nota otomatis setelah transaksi</label>'+
      '<form class="stack" id="fNotaInfo"><span class="label">Isi nota</span><label class="f">Alamat toko<input id="nAlamat" value="'+esc(draft.alamat)+'" placeholder="mis. Jl. Raya Ubud No. 12, Gianyar"></label><label class="f">Telepon / WA toko<input id="nTelp" inputmode="tel" value="'+esc(draft.telp)+'"></label><label class="f">Catatan bawah nota<input id="nFooter" value="'+esc(draft.footer)+'" placeholder="Terima kasih sudah berbelanja!"></label></form>'+
      '<div class="split"><button class="btn ghost" type="button" id="pTest">Cetak tes</button><button class="btn" type="button" id="pSave">Simpan</button></div>';
    return h};
  openSheet("Printer & nota",body(),function mount(sh){
    const sel=sh.querySelector("#pWin");
    if(sel&&window.catatDesktop){window.catatDesktop.printers().then(list=>{list.forEach(p=>{const o=document.createElement("option");o.value=p.name;o.textContent=p.displayName+(p.isDefault?" (default)":"");if(p.name===c.win)o.selected=true;sel.appendChild(o)})}).catch(()=>{})}
    sh.querySelectorAll("[data-paper]").forEach(b=>b.addEventListener("click",()=>{grab(sh);c.paper=b.dataset.paper;sh.innerHTML=sh.querySelector(".sheet-head").outerHTML+body();mount(sh)}));
    const scan=sh.querySelector("#btScan");
    if(scan)scan.addEventListener("click",async()=>{const CP=window.Capacitor.Plugins.CatatPrint;if(!CP){toast("Install versi terbaru untuk memakai printer Bluetooth");return}
      scan.disabled=true;try{const r=await CP.listBluetooth();const box=sh.querySelector("#btList");const devs=(r&&r.devices)||[];
        box.innerHTML=devs.length?'<div class="list">'+devs.map(d=>'<div class="row tap" data-bt="'+esc(d.address)+'" data-btn="'+esc(d.name)+'"><div class="av c1">BT</div><div class="main"><b>'+esc(d.name)+'</b><small class="num">'+esc(d.address)+'</small></div>'+(d.address===c.btAddress?'<span class="pill g">Dipilih</span>':'')+'</div>').join("")+'</div>':'<div class="banner">Belum ada perangkat yang dipasangkan. Pasangkan printer di Setelan Bluetooth HP dulu.</div>';
        box.querySelectorAll("[data-bt]").forEach(rw=>rw.addEventListener("click",()=>{grab(sh);c.btAddress=rw.dataset.bt;c.btName=rw.dataset.btn;sh.innerHTML=sh.querySelector(".sheet-head").outerHTML+body();mount(sh);toast("Printer dipilih: "+c.btName)}));
      }catch(e){toast((e&&e.message)||"Gagal membaca Bluetooth")}finally{scan.disabled=false}});
    const save=async()=>{grab(sh);savePrinterCfg(c);await saveToko({alamat:draft.alamat.trim(),telp:draft.telp.trim(),footer:draft.footer.trim()})};
    sh.querySelector("#pTest").addEventListener("click",async()=>{await save();printDoc("tes",{paper:c.paper})});
    sh.querySelector("#pSave").addEventListener("click",async()=>{await save();toast("Pengaturan printer disimpan");if(after){after()}else closeSheet()});
  });
  function grab(sh){const s=sh.querySelector("#pWin");if(s)c.win=s.value;const a=sh.querySelector("#pAuto");if(a)c.auto=a.checked;
    [["nAlamat","alamat"],["nTelp","telp"],["nFooter","footer"]].forEach(([id,k])=>{const el=sh.querySelector("#"+id);if(el)draft[k]=el.value});}
}

async function backup(){

function restoreFile(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.aplikasi!=="catat-toko")throw new Error("bukan cadangan");
    if(d.toko)S.toko=Object.assign({nama:"Toko Saya",minStok:5},d.toko);for(const c of COLS)S[c]=Array.isArray(d[c])?d[c]:[];
    S.cart={};if(S.user&&!S.pengguna.some(u=>u.id===S.user.id))S.user=null;persist();closeSheet();render();toast("Data dipulihkan dari cadangan")}catch(e){toast("File ini bukan cadangan Catat Toko")}};
  r.readAsText(file);
}

  if(a==="addCart"){const p=S.produk.find(x=>x.id===id);if(!p)return;S.cart[id]=(S.cart[id]||0)+1;if(S.cart[id]>p.stok)toast("Stok "+p.nama+" tinggal "+p.stok);render();focusSearch();return}

function selectEl(el){if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Teks dipilih, salin manual")}
document.addEventListener("input",e=>{if(e.target.id==="qProduk"){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=$("#qProduk");if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();
  if(e.key==="Enter"&&e.target&&e.target.id==="qProduk"){e.preventDefault();handleCode(e.target.value)}});
$("#btnSettings").addEventListener("click",sheetSettings);

/* ---------- boot ---------- */
function boot(){
  loadLocal();S.mode="live";render();
  setTimeout(()=>autoBackup(false),4000);setInterval(()=>autoBackup(false),3600000);
  if(isNative()&&window.Capacitor.Plugins.App){window.Capacitor.Plugins.App.addListener("backButton",()=>{if($("#sheetRoot").innerHTML)closeSheet();else if(S.tab!=="beranda"){S.tab="beranda";render()}else window.Capacitor.Plugins.App.exitApp()})}
}
boot();
})();
</script>
</body>
